<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Movement Art Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 20px;
            color: white;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        .main-canvas {
            flex: 1;
            position: relative;
            cursor: crosshair;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .control-group {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-group h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #fff;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        select, input[type="range"], input[type="color"] {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-bottom: 10px;
        }

        select option {
            background: #333;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .primary-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .stats {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .recording-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 8px;
            font-size: 12px;
            border-radius: 6px;
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
        }

        .trail-preview {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .performance-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 50%;
            cursor: pointer;
        }

        .export-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Art Generator</h1>
            
            <div class="stats">
                <div class="stat-item">
                    <span>Strokes:</span>
                    <span id="strokeCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Avg Speed:</span>
                    <span id="avgSpeed">0 px/s</span>
                </div>
                <div class="stat-item">
                    <span>Max Speed:</span>
                    <span id="maxSpeed">0 px/s</span>
                </div>
                <div class="stat-item">
                    <span>Canvas Size:</span>
                    <span id="canvasSize">-</span>
                </div>
            </div>

            <div class="control-group">
                <h3>Art Mode</h3>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="fluid">Fluid</button>
                    <button class="mode-btn" data-mode="geometric">Geometric</button>
                    <button class="mode-btn" data-mode="particle">Particle</button>
                    <button class="mode-btn" data-mode="fractal">Fractal</button>
                </div>
            </div>

            <div class="control-group">
                <h3>Brush Settings</h3>
                <label>Brush Size: <span id="brushSizeValue">15</span>px</label>
                <input type="range" id="brushSize" min="1" max="50" value="15">
                
                <label>Opacity: <span id="opacityValue">0.8</span></label>
                <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.8">
                
                <label>Speed Sensitivity: <span id="speedSensitivityValue">2</span></label>
                <input type="range" id="speedSensitivity" min="0.5" max="5" step="0.1" value="2">
            </div>

            <div class="control-group">
                <h3>Color Palette</h3>
                <select id="colorMode">
                    <option value="rainbow">Rainbow Spectrum</option>
                    <option value="sunset">Sunset Gradient</option>
                    <option value="ocean">Ocean Blues</option>
                    <option value="forest">Forest Greens</option>
                    <option value="fire">Fire Reds</option>
                    <option value="custom">Custom Color</option>
                </select>
                <input type="color" id="customColor" value="#ff6b6b" style="display: none;">
            </div>

            <div class="control-group">
                <h3>Effects</h3>
                <label>
                    <input type="checkbox" id="trailEffect"> Trail Effect
                </label>
                <label>
                    <input type="checkbox" id="glowEffect" checked> Glow Effect
                </label>
                <label>
                    <input type="checkbox" id="symmetryMode"> Symmetry Mode
                </label>
                <label>
                    <input type="checkbox" id="fadeEffect"> Fade Effect
                </label>
            </div>

            <div class="control-group">
                <h3>Controls</h3>
                <button class="primary-btn" id="clearCanvas">Clear Canvas</button>
                <button class="secondary-btn" id="toggleRecording">Start Recording</button>
                <button class="secondary-btn" id="saveImage">Save as PNG</button>
                <button class="secondary-btn" id="saveVideo">Save Video</button>
                <div class="export-options">
                    <button class="secondary-btn" id="saveSVG">Save SVG</button>
                    <button class="secondary-btn" id="saveGIF">Save GIF</button>
                </div>
            </div>
        </div>

        <div class="main-canvas">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div class="recording-indicator" id="recordingIndicator">
        ● RECORDING
    </div>

    <div class="performance-indicator" id="performanceIndicator">
        FPS: 60 | Objects: 0
    </div>

    <script>
        class MouseArtGenerator {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.isDrawing = false;
                this.isRecording = false;
                this.lastPos = { x: 0, y: 0 };
                this.currentPos = { x: 0, y: 0 };
                this.strokes = [];
                this.currentStroke = [];
                this.particles = [];
                this.frameCount = 0;
                this.lastFrameTime = 0;
                this.fps = 60;
                
                // Settings
                this.settings = {
                    brushSize: 15,
                    opacity: 0.8,
                    speedSensitivity: 2,
                    colorMode: 'rainbow',
                    customColor: '#ff6b6b',
                    artMode: 'fluid',
                    trailEffect: false,
                    glowEffect: true,
                    symmetryMode: false,
                    fadeEffect: false
                };

                // Statistics
                this.stats = {
                    strokeCount: 0,
                    totalSpeed: 0,
                    maxSpeed: 0,
                    speedSamples: 0
                };

                this.init();
            }

            init() {
                this.setupCanvas();
                this.setupEventListeners();
                this.setupControls();
                this.animate();
                this.updateStats();
            }

            setupCanvas() {
                const resizeCanvas = () => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.canvas.width = rect.width * window.devicePixelRatio;
                    this.canvas.height = rect.height * window.devicePixelRatio;
                    this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                    this.canvas.style.width = rect.width + 'px';
                    this.canvas.style.height = rect.height + 'px';
                    
                    document.getElementById('canvasSize').textContent = 
                        `${Math.round(rect.width)} × ${Math.round(rect.height)}`;
                };

                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                // Set canvas background
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            setupEventListeners() {
                // Mouse events
                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', () => this.stopDrawing());
                this.canvas.addEventListener('mouseout', () => this.stopDrawing());

                // Touch events for mobile
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const mouseEvent = new MouseEvent('mouseup', {});
                    this.canvas.dispatchEvent(mouseEvent);
                });
            }

            setupControls() {
                // Mode selection
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelector('.mode-btn.active').classList.remove('active');
                        btn.classList.add('active');
                        this.settings.artMode = btn.dataset.mode;
                    });
                });

                // Sliders
                const sliders = ['brushSize', 'opacity', 'speedSensitivity'];
                sliders.forEach(id => {
                    const slider = document.getElementById(id);
                    const valueSpan = document.getElementById(id + 'Value');
                    slider.addEventListener('input', (e) => {
                        this.settings[id] = parseFloat(e.target.value);
                        valueSpan.textContent = e.target.value;
                    });
                });

                // Color mode
                document.getElementById('colorMode').addEventListener('change', (e) => {
                    this.settings.colorMode = e.target.value;
                    const customColor = document.getElementById('customColor');
                    customColor.style.display = e.target.value === 'custom' ? 'block' : 'none';
                });

                document.getElementById('customColor').addEventListener('change', (e) => {
                    this.settings.customColor = e.target.value;
                });

                // Checkboxes
                const checkboxes = ['trailEffect', 'glowEffect', 'symmetryMode', 'fadeEffect'];
                checkboxes.forEach(id => {
                    document.getElementById(id).addEventListener('change', (e) => {
                        this.settings[id] = e.target.checked;
                    });
                });

                // Buttons
                document.getElementById('clearCanvas').addEventListener('click', () => this.clearCanvas());
                document.getElementById('toggleRecording').addEventListener('click', () => this.toggleRecording());
                document.getElementById('saveImage').addEventListener('click', () => this.saveImage());
                document.getElementById('saveSVG').addEventListener('click', () => this.saveSVG());
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            startDrawing(e) {
                this.isDrawing = true;
                const pos = this.getMousePos(e);
                this.lastPos = pos;
                this.currentPos = pos;
                this.currentStroke = [{ ...pos, timestamp: Date.now() }];
                this.stats.strokeCount++;
            }

            draw(e) {
                if (!this.isDrawing) return;

                const pos = this.getMousePos(e);
                this.currentPos = pos;

                // Calculate speed
                const dx = pos.x - this.lastPos.x;
                const dy = pos.y - this.lastPos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const speed = distance * this.settings.speedSensitivity;

                // Update statistics
                this.stats.totalSpeed += speed;
                this.stats.speedSamples++;
                this.stats.maxSpeed = Math.max(this.stats.maxSpeed, speed);

                // Add to current stroke
                this.currentStroke.push({ ...pos, timestamp: Date.now(), speed });

                // Draw based on art mode
                switch (this.settings.artMode) {
                    case 'fluid':
                        this.drawFluid(pos, speed);
                        break;
                    case 'geometric':
                        this.drawGeometric(pos, speed);
                        break;
                    case 'particle':
                        this.drawParticle(pos, speed);
                        break;
                    case 'fractal':
                        this.drawFractal(pos, speed);
                        break;
                }

                this.lastPos = pos;
            }

            stopDrawing() {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    if (this.currentStroke.length > 0) {
                        this.strokes.push([...this.currentStroke]);
                        this.currentStroke = [];
                    }
                }
            }

            drawFluid(pos, speed) {
                const color = this.getColor(speed);
                const size = Math.max(1, this.settings.brushSize - speed * 0.1);
                
                this.ctx.globalAlpha = this.settings.opacity;
                this.ctx.fillStyle = color;
                
                if (this.settings.glowEffect) {
                    this.ctx.shadowColor = color;
                    this.ctx.shadowBlur = size * 0.5;
                } else {
                    this.ctx.shadowBlur = 0;
                }

                // Main stroke
                this.ctx.beginPath();
                this.ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
                this.ctx.fill();

                // Symmetry mode
                if (this.settings.symmetryMode) {
                    const centerX = this.canvas.clientWidth / 2;
                    const centerY = this.canvas.clientHeight / 2;
                    const mirrorX = centerX * 2 - pos.x;
                    const mirrorY = centerY * 2 - pos.y;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(mirrorX, mirrorY, size, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                // Trail effect
                if (this.settings.trailEffect) {
                    this.ctx.globalAlpha = this.settings.opacity * 0.3;
                    this.ctx.beginPath();
                    this.ctx.arc(pos.x + Math.random() * 10 - 5, pos.y + Math.random() * 10 - 5, size * 0.5, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            drawGeometric(pos, speed) {
                const color = this.getColor(speed);
                const size = this.settings.brushSize + speed * 0.2;
                
                this.ctx.globalAlpha = this.settings.opacity;
                this.ctx.fillStyle = color;
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = 2;

                // Draw polygon based on speed
                const sides = Math.max(3, Math.floor(speed / 10) + 3);
                this.drawPolygon(pos.x, pos.y, size, sides);
            }

            drawParticle(pos, speed) {
                const particleCount = Math.floor(speed / 5) + 1;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = {
                        x: pos.x + (Math.random() - 0.5) * 20,
                        y: pos.y + (Math.random() - 0.5) * 20,
                        vx: (Math.random() - 0.5) * speed * 0.1,
                        vy: (Math.random() - 0.5) * speed * 0.1,
                        size: Math.random() * this.settings.brushSize * 0.5,
                        color: this.getColor(speed),
                        life: 1.0,
                        decay: 0.02
                    };
                    this.particles.push(particle);
                }
            }

            drawFractal(pos, speed) {
                const color = this.getColor(speed);
                const depth = Math.floor(speed / 20) + 2;
                
                this.ctx.globalAlpha = this.settings.opacity;
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = 1;

                this.drawFractalBranch(pos.x, pos.y, this.settings.brushSize, 0, depth);
            }

            drawPolygon(centerX, centerY, radius, sides) {
                this.ctx.beginPath();
                for (let i = 0; i < sides; i++) {
                    const angle = (i / sides) * 2 * Math.PI;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
            }

            drawFractalBranch(x, y, length, angle, depth) {
                if (depth <= 0) return;

                const endX = x + Math.cos(angle) * length;
                const endY = y + Math.sin(angle) * length;

                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
                this.ctx.lineTo(endX, endY);
                this.ctx.stroke();

                const newLength = length * 0.7;
                this.drawFractalBranch(endX, endY, newLength, angle - 0.5, depth - 1);
                this.drawFractalBranch(endX, endY, newLength, angle + 0.5, depth - 1);
            }

            getColor(speed) {
                const normalizedSpeed = Math.min(speed / 100, 1);
                
                switch (this.settings.colorMode) {
                    case 'rainbow':
                        const hue = (normalizedSpeed * 360 + this.frameCount) % 360;
                        return `hsl(${hue}, 100%, 60%)`;
                    case 'sunset':
                        return `hsl(${30 - normalizedSpeed * 30}, 100%, ${60 + normalizedSpeed * 20}%)`;
                    case 'ocean':
                        return `hsl(${200 + normalizedSpeed * 60}, 100%, ${40 + normalizedSpeed * 30}%)`;
                    case 'forest':
                        return `hsl(${120 + normalizedSpeed * 60}, ${60 + normalizedSpeed * 40}%, ${30 + normalizedSpeed * 30}%)`;
                    case 'fire':
                        return `hsl(${15 - normalizedSpeed * 15}, 100%, ${50 + normalizedSpeed * 30}%)`;
                    case 'custom':
                        return this.settings.customColor;
                    default:
                        return '#ff6b6b';
                }
            }

            animate() {
                const currentTime = performance.now();
                const deltaTime = currentTime - this.lastFrameTime;
                this.fps = Math.round(1000 / deltaTime);
                this.lastFrameTime = currentTime;

                // Apply fade effect
                if (this.settings.fadeEffect && this.frameCount % 2 === 0) {
                    this.ctx.globalAlpha = 0.02;
                    this.ctx.fillStyle = '#000';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                // Update particles
                this.updateParticles();

                this.frameCount++;
                requestAnimationFrame(() => this.animate());
            }

            updateParticles() {
                this.particles = this.particles.filter(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life -= particle.decay;

                    if (particle.life > 0) {
                        this.ctx.globalAlpha = particle.life * this.settings.opacity;
                        this.ctx.fillStyle = particle.color;
                        this.ctx.beginPath();
                        this.ctx.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
                        this.ctx.fill();
                        return true;
                    }
                    return false;
                });
            }

            updateStats() {
                document.getElementById('strokeCount').textContent = this.stats.strokeCount;
                
                const avgSpeed = this.stats.speedSamples > 0 
                    ? Math.round(this.stats.totalSpeed / this.stats.speedSamples)
                    : 0;
                document.getElementById('avgSpeed').textContent = `${avgSpeed} px/s`;
                document.getElementById('maxSpeed').textContent = `${Math.round(this.stats.maxSpeed)} px/s`;

                document.getElementById('performanceIndicator').textContent = 
                    `FPS: ${this.fps} | Particles: ${this.particles.length}`;

                setTimeout(() => this.updateStats(), 100);
            }

            clearCanvas() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.strokes = [];
                this.particles = [];
                this.stats = { strokeCount: 0, totalSpeed: 0, maxSpeed: 0, speedSamples: 0 };
            }

            toggleRecording() {
                const btn = document.getElementById('toggleRecording');
                const indicator = document.getElementById('recordingIndicator');
                
                this.isRecording = !this.isRecording;
                
                if (this.isRecording) {
                    btn.textContent = 'Stop Recording';
                    btn.classList.remove('secondary-btn');
                    btn.classList.add('primary-btn');
                    indicator.style.display = 'block';
                } else {
                    btn.textContent = 'Start Recording';
                    btn.classList.remove('primary-btn');
                    btn.classList.add('secondary-btn');
                    indicator.style.display = 'none';
                }
            }

            saveImage() {
                const link = document.createElement('a');
                link.download = `mouse-art-${Date.now()}.png`;
                link.href = this.canvas.toDataURL();
                link.click();
            }

            saveSVG() {
                const svg = this.generateSVG();
                const blob = new Blob([svg], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `mouse-art-${Date.now()}.svg`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            }

            generateSVG() {
                const width = this.canvas.clientWidth;
                const height = this.canvas.clientHeight;
                
                let svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">`;
                svg += `<rect width="100%" height="100%" fill="#000"/>`;
                
                this.strokes.forEach((stroke, strokeIndex) => {
                    if (stroke.length < 2) return;
                    
                    const path = stroke.map((point, index) => {
                        const command = index === 0 ? 'M' : 'L';
                        return `${command}${point.x},${point.y}`;
                    }).join(' ');
                    
                    const color = this.getColor(stroke[0].speed || 50);
                    svg += `<path d="${path}" stroke="${color}" stroke-width="${this.settings.brushSize}" fill="none" opacity="${this.settings.opacity}"/>`;
                });
                
                svg += '</svg>';
                return svg;
            }
        }

        // Initialize the application
        const artGenerator = new MouseArtGenerator();
    </script>
</body>
</html>
