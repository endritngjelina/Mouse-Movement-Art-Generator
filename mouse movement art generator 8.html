<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Art Studio | Next-Gen Mouse Art Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/style-transfer@0.1.0/dist/style-transfer.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            --danger-gradient: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            --success-gradient: linear-gradient(135deg, #0cebeb 0%, #20e3b2 50%, #29ffc6 100%);
            --dark-bg: #0a0a16;
            --panel-bg: rgba(20, 22, 40, 0.95);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-color: #667eea;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        /* Header styles */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(10, 10, 22, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--panel-border);
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            gap: 16px;
        }

        /* Main container */
        .container {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
            background: radial-gradient(ellipse at top left, rgba(120, 119, 198, 0.15), transparent 50%),
                        radial-gradient(ellipse at top right, rgba(255, 0, 128, 0.15), transparent 50%),
                        radial-gradient(ellipse at center right, rgba(74, 144, 226, 0.15), transparent 50%),
                        radial-gradient(ellipse at center left, rgba(142, 249, 243, 0.15), transparent 50%);
        }

        /* Sidebar styles */
        .sidebar {
            width: 360px;
            background: var(--panel-bg);
            backdrop-filter: blur(40px) saturate(180%);
            border-right: 1px solid var(--panel-border);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .sidebar-content {
            padding: 24px;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        /* Canvas area */
        .main-canvas {
            flex: 1;
            position: relative;
            cursor: none;
            background: #000;
            overflow: hidden;
        }

        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transition: transform 0.1s ease;
            mix-blend-mode: difference;
            display: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Control groups */
        .control-group {
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-group:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .control-group h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group h3::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        select, input[type="color"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            margin-bottom: 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        select:focus, input[type="color"]:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        select option {
            background: #1a1a2e;
            color: white;
            padding: 8px;
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        .primary-btn {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .danger-btn {
            background: var(--danger-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
        }

        .success-btn {
            background: var(--success-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(12, 235, 235, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .primary-btn:hover {
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        /* Stats panel */
        .stats {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6));
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-item span:first-child {
            color: var(--text-secondary);
        }

        .stat-item span:last-child {
            color: #fff;
            font-weight: 600;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Indicators */
        .recording-indicator {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--danger-gradient);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            display: none;
            animation: pulse 2s infinite;
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
        }

        .performance-indicator {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .ai-indicator {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.8);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 107, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        /* Mode selector */
        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .mode-btn {
            padding: 12px 8px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: translateY(-1px);
        }

        .mode-btn.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        /* Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            margin: 16px 0;
            position: relative;
        }

        input[type="range"]::-webkit-slider-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-gradient);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--primary-gradient);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        /* Export options */
        .export-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Checkboxes */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 8px 0;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin: 0;
            transform: scale(1.2);
            accent-color: var(--accent-color);
        }

        .checkbox-container label {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            display: block;
        }

        .value-display {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            min-width: 40px;
            text-align: center;
        }

        /* AI Styles Preview */
        .ai-styles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .style-preview {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .style-preview:hover {
            transform: scale(1.05);
        }

        .style-preview.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1);
            }
            50% { 
                opacity: 0.8; 
                transform: scale(1.05);
            }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .sidebar {
                width: 320px;
            }
        }

        @media (max-width: 992px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 50vh;
                border-right: none;
                border-bottom: 1px solid var(--panel-border);
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="logo">
            <div class="logo-icon">🧠</div>
            <div class="logo-text">Neural Art Studio</div>
        </div>
        <div class="header-controls">
            <button class="secondary-btn" id="voiceControlBtn">🎤 Voice Control</button>
            <button class="secondary-btn" id="collabBtn">👥 Start Collaboration</button>
        </div>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-content">
                <div class="stats">
                    <div class="stat-item">
                        <span>Active Strokes</span>
                        <span id="strokeCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Velocity Avg</span>
                        <span id="avgSpeed">0 px/s</span>
                    </div>
                    <div class="stat-item">
                        <span>Peak Velocity</span>
                        <span id="maxSpeed">0 px/s</span>
                    </div>
                    <div class="stat-item">
                        <span>Resolution</span>
                        <span id="canvasSize">-</span>
                    </div>
                    <div class="stat-item">
                        <span>GPU Backend</span>
                        <span id="gpuBackend">WebGL</span>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Generation Mode</h3>
                    <div class="mode-selector">
                        <button class="mode-btn active" data-mode="fluid">Fluid</button>
                        <button class="mode-btn" data-mode="geometric">Geometric</button>
                        <button class="mode-btn" data-mode="particle">Particle</button>
                        <button class="mode-btn" data-mode="fractal">Fractal</button>
                        <button class="mode-btn" data-mode="neural">Neural AI</button>
                        <button class="mode-btn" data-mode="3d">3D Depth</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Brush Parameters</h3>
                    <label>
                        <span>Brush Radius</span>
                        <span class="value-display" id="brushSizeValue">15</span>
                    </label>
                    <input type="range" id="brushSize" min="1" max="50" value="15">
                    
                    <label>
                        <span>Opacity</span>
                        <span class="value-display" id="opacityValue">0.8</span>
                    </label>
                    <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.8">
                    
                    <label>
                        <span>Velocity Response</span>
                        <span class="value-display" id="speedSensitivityValue">2.0</span>
                    </label>
                    <input type="range" id="speedSensitivity" min="0.5" max="5" step="0.1" value="2">
                    
                    <label>
                        <span>Depth Effect</span>
                        <span class="value-display" id="depthValue">0.5</span>
                    </label>
                    <input type="range" id="depthEffect" min="0" max="1" step="0.1" value="0.5">
                </div>

                <div class="control-group">
                    <h3>AI Style Transfer</h3>
                    <select id="styleMode">
                        <option value="none">None</option>
                        <option value="starry_night">Starry Night</option>
                        <option value="wave">The Great Wave</option>
                        <option value="mosaic">Cubist Mosaic</option>
                        <option value="abstract">Abstract Expression</option>
                        <option value="custom">Custom Style</option>
                    </select>
                    <div class="ai-styles">
                        <div class="style-preview" data-style="starry_night" style="background: linear-gradient(45deg, #0a0a16, #2a2a4a, #4a4a7a, #6a6aaa);"></div>
                        <div class="style-preview" data-style="wave" style="background: linear-gradient(45deg, #0a0a16, #1a3a5a, #2a6a9a, #3a9ada);"></div>
                        <div class="style-preview" data-style="mosaic" style="background: linear-gradient(45deg, #0a0a16, #3a1a3a, #6a2a6a, #9a3a9a);"></div>
                        <div class="style-preview" data-style="abstract" style="background: linear-gradient(45deg, #0a0a16, #5a1a1a, #aa2a2a, #ff3a3a);"></div>
                        <div class="style-preview" data-style="custom" style="background: linear-gradient(45deg, #0a0a16, #1a5a3a, #2aaa6a, #3aff9a);"></div>
                        <div class="style-preview" data-style="custom" style="background: linear-gradient(45deg, #0a0a16, #5a3a1a, #aa6a2a, #ff9a3a);"></div>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Visual Effects</h3>
                    <div class="checkbox-container">
                        <input type="checkbox" id="trailEffect">
                        <label for="trailEffect">Motion Trails</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="glowEffect" checked>
                        <label for="glowEffect">Luminescence</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="symmetryMode">
                        <label for="symmetryMode">Mirror Mode</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="fadeEffect">
                        <label for="fadeEffect">Temporal Fade</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="depthMode">
                        <label for="depthMode">3D Perspective</label>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Session Control</h3>
                    <button class="primary-btn" id="clearCanvas">Reset Canvas</button>
                    <button class="secondary-btn" id="toggleRecording">Start Capture</button>
                    <div class="export-options">
                        <button class="success-btn" id="saveImage">Export PNG</button>
                        <button class="success-btn" id="saveSVG">Export SVG</button>
                        <button class="success-btn" id="saveGIF">Export GIF</button>
                        <button class="success-btn" id="saveVideo">Export MP4</button>
                        <button class="secondary-btn" id="shareArt">Share Link</button>
                        <button class="secondary-btn" id="savePreset">Save Preset</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-canvas">
            <div class="custom-cursor" id="customCursor"></div>
            <canvas id="canvas"></canvas>
            <div class="performance-indicator" id="performanceIndicator">
                FPS: 60 | Particles: 0 | GPU: ACTIVE
            </div>
            <div class="ai-indicator" id="aiIndicator">
                AI: STYLE TRANSFER INITIALIZING...
            </div>
        </div>
    </div>

    <div class="recording-indicator" id="recordingIndicator">
        ● NEURAL CAPTURE ACTIVE
    </div>

    <script>
        class MouseArtGenerator {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.isDrawing = false;
                this.isRecording = false;
                this.lastPos = { x: 0, y: 0 };
                this.currentPos = { x: 0, y: 0 };
                this.strokes = [];
                this.currentStroke = [];
                this.particles = [];
                this.frameCount = 0;
                this.lastFrameTime = 0;
                this.fps = 60;
                this.gpuBackend = 'WebGL';
                this.aiModel = null;
                this.aiStyle = null;
                this.styleTransferActive = false;
                this.collaborationActive = false;
                this.collaborationSocket = null;
                
                // Settings
                this.settings = {
                    brushSize: 15,
                    opacity: 0.8,
                    speedSensitivity: 2,
                    depthEffect: 0.5,
                    colorMode: 'rainbow',
                    customColor: '#ff6b6b',
                    artMode: 'fluid',
                    trailEffect: false,
                    glowEffect: true,
                    symmetryMode: false,
                    fadeEffect: false,
                    depthMode: false,
                    styleMode: 'none'
                };

                // Statistics
                this.stats = {
                    strokeCount: 0,
                    totalSpeed: 0,
                    maxSpeed: 0,
                    speedSamples: 0
                };

                this.init();
            }

            async init() {
                this.setupCanvas();
                this.setupEventListeners();
                this.setupControls();
                this.setupCustomCursor();
                this.animate();
                this.updateStats();
                
                // Initialize AI model
                this.initAIModel();
                
                // Try to initialize WebGPU
                await this.initWebGPU();
            }

            async initWebGPU() {
                if (!navigator.gpu) {
                    console.log("WebGPU not supported, falling back to WebGL");
                    document.getElementById('gpuBackend').textContent = 'WebGL';
                    return;
                }
                
                try {
                    const adapter = await navigator.gpu.requestAdapter();
                    const device = await adapter.requestDevice();
                    const context = this.canvas.getContext('webgpu');
                    
                    const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
                    context.configure({
                        device: device,
                        format: canvasFormat,
                        alphaMode: "premultiplied"
                    });

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * window.devicePixelRatio,
                    y: (e.clientY - rect.top) * window.devicePixelRatio
                };
            }

            startDrawing(e) {
                this.isDrawing = true;
                const pos = this.getMousePos(e);
                this.lastPos = pos;
                this.currentPos = pos;
                this.currentStroke = [{ ...pos, timestamp: Date.now() }];
                this.stats.strokeCount++;
                
                // Send to collaborators
                if (this.collaborationActive) {
                    // In real implementation, send via WebSocket
                }
            }

            draw(e) {
                if (!this.isDrawing) return;

                const pos = this.getMousePos(e);
                this.currentPos = pos;

                // Calculate speed
                const dx = pos.x - this.lastPos.x;
                const dy = pos.y - this.lastPos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const speed = distance * this.settings.speedSensitivity;

                // Update statistics
                this.stats.totalSpeed += speed;
                this.stats.speedSamples++;
                this.stats.maxSpeed = Math.max(this.stats.maxSpeed, speed);

                // Add to current stroke
                this.currentStroke.push({ ...pos, timestamp: Date.now(), speed });

                // Draw based on art mode
                switch (this.settings.artMode) {
                    case 'fluid':
                        this.drawFluid(pos, speed);
                        break;
                    case 'geometric':
                        this.drawGeometric(pos, speed);
                        break;
                    case 'particle':
                        this.drawParticle(pos, speed);
                        break;
                    case 'fractal':
                        this.drawFractal(pos, speed);
                        break;
                    case 'neural':
                        this.drawNeural(pos, speed);
                        break;
                    case '3d':
                        this.draw3D(pos, speed);
                        break;
                }

                this.lastPos = pos;
            }

            stopDrawing() {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    if (this.currentStroke.length > 0) {
                        this.strokes.push([...this.currentStroke]);
                        this.currentStroke = [];
                    }
                    
                    // Apply style transfer if needed
                    if (this.settings.styleMode !== 'none' && this.aiModel) {
                        this.applyStyleTransfer();
                    }
                }
            }

            async applyStyleTransfer() {
                try {
                    document.getElementById('aiIndicator').textContent = 'AI: Processing...';
                    // In a real implementation, we would use the AI model
                    // For demo, we'll just add a visual effect
                    this.ctx.globalAlpha = 0.3;
                    this.ctx.fillStyle = this.getColor(50);
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    await new Promise(resolve => setTimeout(resolve, 500));
                    document.getElementById('aiIndicator').textContent = 'AI: Style applied';
                } catch (error) {
                    console.error("Style transfer failed:", error);
                    document.getElementById('aiIndicator').textContent = 'AI: Error applying style';
                }
            }

            drawFluid(pos, speed) {
                const color = this.getColor(speed);
                const size = Math.max(1, this.settings.brushSize - speed * 0.1);
                
                this.ctx.globalAlpha = this.settings.opacity;
                this.ctx.fillStyle = color;
                
                if (this.settings.glowEffect) {
                    this.ctx.shadowColor = color;
                    this.ctx.shadowBlur = size * 0.5;
                } else {
                    this.ctx.shadowBlur = 0;
                }

                // Main stroke
                this.ctx.beginPath();
                this.ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
                this.ctx.fill();

                // Symmetry mode
                if (this.settings.symmetryMode) {
                    const centerX = this.canvas.width / 2;
                    const centerY = this.canvas.height / 2;
                    const mirrorX = centerX * 2 - pos.x;
                    const mirrorY = centerY * 2 - pos.y;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(mirrorX, mirrorY, size, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                // Trail effect
                if (this.settings.trailEffect) {
                    this.ctx.globalAlpha = this.settings.opacity * 0.3;
                    this.ctx.beginPath();
                    this.ctx.arc(pos.x + Math.random() * 10 - 5, pos.y + Math.random() * 10 - 5, size * 0.5, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            drawGeometric(pos, speed) {
                const color = this.getColor(speed);
                const size = this.settings.brushSize + speed * 0.2;
                
                this.ctx.globalAlpha = this.settings.opacity;
                this.ctx.fillStyle = color;
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = 2;

                // Draw polygon based on speed
                const sides = Math.max(3, Math.floor(speed / 10) + 3);
                this.drawPolygon(pos.x, pos.y, size, sides);
            }

            drawParticle(pos, speed) {
                const particleCount = Math.floor(speed / 5) + 1;
                
                for (let i = 0; i < particleCount; i++) {
                    const depth = this.settings.depthMode ? 0.5 + Math.random() * 0.5 : 1;
                    const size = Math.random() * this.settings.brushSize * 0.5 * depth;
                    
                    const particle = {
                        x: pos.x + (Math.random() - 0.5) * 20,
                        y: pos.y + (Math.random() - 0.5) * 20,
                        vx: (Math.random() - 0.5) * speed * 0.1,
                        vy: (Math.random() - 0.5) * speed * 0.1,
                        size: size,
                        color: this.getColor(speed),
                        life: 1.0,
                        decay: 0.02,
                        depth: depth
                    };
                    this.particles.push(particle);
                }
            }

            drawFractal(pos, speed) {
                const color = this.getColor(speed);
                const depth = Math.floor(speed / 20) + 2;
                
                this.ctx.globalAlpha = this.settings.opacity;
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = 1;

                this.drawFractalBranch(pos.x, pos.y, this.settings.brushSize, 0, depth);
            }

            drawNeural(pos, speed) {
                const color = this.getColor(speed);
                const size = Math.max(1, this.settings.brushSize - speed * 0.1);
                
                this.ctx.globalAlpha = this.settings.opacity;
                this.ctx.fillStyle = color;
                
                this.ctx.beginPath();
                this.ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Add neural network-like connections
                if (this.strokes.length > 0 && this.strokes[this.strokes.length - 1].length > 10) {
                    const lastStroke = this.strokes[this.strokes.length - 1];
                    const lastPoint = lastStroke[lastStroke.length - 1];
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(lastPoint.x, lastPoint.y);
                    this.ctx.lineTo(pos.x, pos.y);
                    this.ctx.strokeStyle = color;
                    this.ctx.lineWidth = 1;
                    this.ctx.stroke();
                    
                    // Add nodes
                    this.ctx.beginPath();
                    this.ctx.arc(lastPoint.x, lastPoint.y, size * 0.3, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            draw3D(pos, speed) {
                const color = this.getColor(speed);
                const size = Math.max(1, this.settings.brushSize - speed * 0.1);
                const depth = 1 - this.settings.depthEffect;
                
                this.ctx.globalAlpha = this.settings.opacity;
                this.ctx.fillStyle = color;
                
                // Apply perspective
                const scale = 0.5 + depth * 0.5;
                const offsetX = (pos.x - this.canvas.width/2) * (1 - scale);
                const offsetY = (pos.y - this.canvas.height/2) * (1 - scale);
                
                this.ctx.beginPath();
                this.ctx.arc(
                    this.canvas.width/2 + offsetX, 
                    this.canvas.height/2 + offsetY, 
                    size * scale, 
                    0, 
                    Math.PI * 2
                );
                this.ctx.fill();
            }

            drawPolygon(centerX, centerY, radius, sides) {
                this.ctx.beginPath();
                for (let i = 0; i < sides; i++) {
                    const angle = (i / sides) * 2 * Math.PI;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
            }

            drawFractalBranch(x, y, length, angle, depth) {
                if (depth <= 0) return;

                const endX = x + Math.cos(angle) * length;
                const endY = y + Math.sin(angle) * length;

                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
                this.ctx.lineTo(endX, endY);
                this.ctx.stroke();

                const newLength = length * 0.7;
                this.drawFractalBranch(endX, endY, newLength, angle - 0.5, depth - 1);
                this.drawFractalBranch(endX, endY, newLength, angle + 0.5, depth - 1);
            }

            getColor(speed) {
                const normalizedSpeed = Math.min(speed / 100, 1);
                
                switch (this.settings.colorMode) {
                    case 'rainbow':
                        const hue = (normalizedSpeed * 360 + this.frameCount) % 360;
                        return `hsl(${hue}, 100%, 60%)`;
                    case 'sunset':
                        return `hsl(${30 - normalizedSpeed * 30}, 100%, ${60 + normalizedSpeed * 20}%)`;
                    case 'ocean':
                        return `hsl(${200 + normalizedSpeed * 60}, 100%, ${40 + normalizedSpeed * 30}%)`;
                    case 'forest':
                        return `hsl(${120 + normalizedSpeed * 60}, ${60 + normalizedSpeed * 40}%, ${30 + normalizedSpeed * 30}%)`;
                    case 'fire':
                        return `hsl(${15 - normalizedSpeed * 15}, 100%, ${50 + normalizedSpeed * 30}%)`;
                    case 'custom':
                        return this.settings.customColor;
                    default:
                        return '#ff6b6b';
                }
            }

            animate() {
                const currentTime = performance.now();
                const deltaTime = currentTime - this.lastFrameTime;
                this.fps = Math.round(1000 / (deltaTime || 1));
                this.lastFrameTime = currentTime;

                // Apply fade effect
                if (this.settings.fadeEffect && this.frameCount % 2 === 0) {
                    this.ctx.globalAlpha = 0.02;
                    this.ctx.fillStyle = '#000';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                // Update particles
                this.updateParticles();

                this.frameCount++;
                requestAnimationFrame(() => this.animate());
            }

            updateParticles() {
                this.particles = this.particles.filter(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life -= particle.decay;

                    if (particle.life > 0) {
                        this.ctx.globalAlpha = particle.life * this.settings.opacity;
                        this.ctx.fillStyle = particle.color;
                        
                        if (this.settings.glowEffect) {
                            this.ctx.shadowColor = particle.color;
                            this.ctx.shadowBlur = particle.size * 0.5;
                        }
                        
                        this.ctx.beginPath();
                        this.ctx.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
                        this.ctx.fill();
                        
                        this.ctx.shadowBlur = 0;
                        return true;
                    }
                    return false;
                });
                
                // Update performance indicator
                document.getElementById('performanceIndicator').textContent = 
                    `FPS: ${this.fps} | Particles: ${this.particles.length} | GPU: ${this.gpuBackend}`;
            }

            updateStats() {
                document.getElementById('strokeCount').textContent = this.stats.strokeCount;
                
                const avgSpeed = this.stats.speedSamples > 0 
                    ? Math.round(this.stats.totalSpeed / this.stats.speedSamples)
                    : 0;
                document.getElementById('avgSpeed').textContent = `${avgSpeed} px/s`;
                document.getElementById('maxSpeed').textContent = `${Math.round(this.stats.maxSpeed)} px/s`;

                setTimeout(() => this.updateStats(), 100);
            }

            generateSVG() {
                const width = this.canvas.clientWidth;
                const height = this.canvas.clientHeight;
                
                let svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">`;
                svg += `<rect width="100%" height="100%" fill="#000"/>`;
                
                this.strokes.forEach((stroke, strokeIndex) => {
                    if (stroke.length < 2) return;
                    
                    const path = stroke.map((point, index) => {
                        const command = index === 0 ? 'M' : 'L';
                        return `${command}${point.x},${point.y}`;
                    }).join(' ');
                    
                    const color = this.getColor(stroke[0].speed || 50);
                    svg += `<path d="${path}" stroke="${color}" stroke-width="${this.settings.brushSize}" fill="none" opacity="${this.settings.opacity}"/>`;
                });
                
                svg += '</svg>';
                return svg;
            }
        }

        // Initialize the application
        const artGenerator = new MouseArtGenerator();
    </script>
</body>
</html>
