<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Movement Art Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: crosshair;
            background: transparent;
        }

        .background-canvas {
            position: absolute;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, #1a1a2e, #16213e, #0f3460);
        }

        .drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }

        .control-group {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .control-group h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 500;
        }

        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        label {
            color: #555;
            font-size: 12px;
            min-width: 80px;
            font-weight: 500;
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 12px;
            flex: 1;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 2px;
        }

        .primary-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .secondary-btn {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }

        .secondary-btn:hover {
            background: #e9ecef;
        }

        .danger-btn {
            background: #dc3545;
            color: white;
        }

        .danger-btn:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .stat-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }

        .color-preview {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .recording-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .recording-indicator.active {
            opacity: 1;
        }

        .recording-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .brush-preview {
            width: 100%;
            height: 40px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            margin-top: 10px;
        }

        .tooltip {
            position: relative;
            cursor: help;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .tooltip:hover::after {
            opacity: 1;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .preset-btn {
            padding: 8px;
            font-size: 11px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: 40vh;
                position: absolute;
                top: 0;
                left: 0;
                z-index: 1000;
                transform: translateY(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.active {
                transform: translateY(0);
            }

            .mobile-toggle {
                position: absolute;
                top: 10px;
                left: 10px;
                z-index: 1001;
                background: rgba(255, 255, 255, 0.9);
                border: none;
                padding: 8px;
                border-radius: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
        
        <div class="sidebar" id="sidebar">
            <h1>🎨 Art Generator</h1>
            
            <div class="control-group">
                <h3>🖌️ Brush Settings</h3>
                <div class="control-row">
                    <label>Size:</label>
                    <input type="range" id="brushSize" min="1" max="50" value="5">
                    <span id="brushSizeValue">5</span>
                </div>
                <div class="control-row">
                    <label>Opacity:</label>
                    <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.8">
                    <span id="opacityValue">0.8</span>
                </div>
                <div class="control-row">
                    <label>Mode:</label>
                    <select id="drawingMode">
                        <option value="speed">Speed Based</option>
                        <option value="pressure">Pressure Simulation</option>
                        <option value="direction">Direction Based</option>
                        <option value="rainbow">Rainbow Trail</option>
                        <option value="particle">Particle System</option>
                        <option value="fractal">Fractal Pattern</option>
                    </select>
                </div>
                <canvas class="brush-preview" id="brushPreview"></canvas>
            </div>

            <div class="control-group">
                <h3>🎨 Colors & Effects</h3>
                <div class="control-row">
                    <label>Primary:</label>
                    <div class="color-preview" id="colorPreview" style="background: #667eea"></div>
                    <input type="color" id="primaryColor" value="#667eea" style="opacity: 0; width: 0;">
                </div>
                <div class="control-row">
                    <label>Blend:</label>
                    <select id="blendMode">
                        <option value="source-over">Normal</option>
                        <option value="multiply">Multiply</option>
                        <option value="screen">Screen</option>
                        <option value="overlay">Overlay</option>
                        <option value="color-dodge">Color Dodge</option>
                        <option value="color-burn">Color Burn</option>
                        <option value="hard-light">Hard Light</option>
                        <option value="soft-light">Soft Light</option>
                        <option value="difference">Difference</option>
                        <option value="exclusion">Exclusion</option>
                    </select>
                </div>
                <div class="control-row">
                    <label class="tooltip" data-tooltip="Speed affects color intensity">Speed Factor:</label>
                    <input type="range" id="speedFactor" min="0.1" max="3" step="0.1" value="1">
                    <span id="speedFactorValue">1.0</span>
                </div>
            </div>

            <div class="control-group">
                <h3>⚡ Physics & Animation</h3>
                <div class="control-row">
                    <label>Smoothing:</label>
                    <input type="range" id="smoothing" min="0" max="0.9" step="0.1" value="0.3">
                    <span id="smoothingValue">0.3</span>
                </div>
                <div class="control-row">
                    <label>Turbulence:</label>
                    <input type="range" id="turbulence" min="0" max="10" value="0">
                    <span id="turbulenceValue">0</span>
                </div>
                <div class="control-row">
                    <label>Fade Rate:</label>
                    <input type="range" id="fadeRate" min="0" max="0.1" step="0.01" value="0">
                    <span id="fadeRateValue">0</span>
                </div>
            </div>

            <div class="control-group">
                <h3>🎛️ Presets</h3>
                <div class="preset-buttons">
                    <button class="preset-btn secondary-btn" onclick="applyPreset('neon')">Neon Glow</button>
                    <button class="preset-btn secondary-btn" onclick="applyPreset('watercolor')">Watercolor</button>
                    <button class="preset-btn secondary-btn" onclick="applyPreset('lightning')">Lightning</button>
                    <button class="preset-btn secondary-btn" onclick="applyPreset('galaxy')">Galaxy</button>
                </div>
            </div>

            <div class="control-group">
                <h3>📊 Statistics</h3>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="totalStrokes">0</div>
                        <div class="stat-label">Strokes</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgSpeed">0</div>
                        <div class="stat-label">Avg Speed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="maxSpeed">0</div>
                        <div class="stat-label">Max Speed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="distance">0</div>
                        <div class="stat-label">Distance</div>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <h3>💾 Actions</h3>
                <button class="primary-btn" onclick="toggleRecording()" id="recordBtn">🔴 Start Recording</button>
                <button class="secondary-btn" onclick="saveArtwork()">💾 Save as PNG</button>
                <button class="secondary-btn" onclick="exportSVG()">📄 Export SVG</button>
                <button class="danger-btn" onclick="clearCanvas()">🗑️ Clear Canvas</button>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="backgroundCanvas" class="background-canvas"></canvas>
            <canvas id="drawingCanvas" class="drawing-canvas"></canvas>
            <div class="recording-indicator" id="recordingIndicator">● RECORDING</div>
        </div>
    </div>

    <script>
        class MouseArtGenerator {
            constructor() {
                this.initializeCanvas();
                this.initializeControls();
                this.initializeState();
                this.initializePhysics();
                this.startAnimationLoop();
                this.updateBrushPreview();
            }

            initializeCanvas() {
                this.bgCanvas = document.getElementById('backgroundCanvas');
                this.drawCanvas = document.getElementById('drawingCanvas');
                this.bgCtx = this.bgCanvas.getContext('2d');
                this.drawCtx = this.drawCanvas.getContext('2d');
                this.previewCanvas = document.getElementById('brushPreview');
                this.previewCtx = this.previewCanvas.getContext('2d');
                
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                this.setupEventListeners();
            }

            initializeControls() {
                this.controls = {
                    brushSize: document.getElementById('brushSize'),
                    opacity: document.getElementById('opacity'),
                    drawingMode: document.getElementById('drawingMode'),
                    primaryColor: document.getElementById('primaryColor'),
                    blendMode: document.getElementById('blendMode'),
                    speedFactor: document.getElementById('speedFactor'),
                    smoothing: document.getElementById('smoothing'),
                    turbulence: document.getElementById('turbulence'),
                    fadeRate: document.getElementById('fadeRate')
                };

                // Setup control event listeners
                Object.keys(this.controls).forEach(key => {
                    this.controls[key].addEventListener('input', () => {
                        this.updateControlDisplay(key);
                        if (key === 'fadeRate') this.setupFading();
                        this.updateBrushPreview();
                    });
                });

                // Color picker integration
                document.getElementById('colorPreview').addEventListener('click', () => {
                    this.controls.primaryColor.click();
                });

                this.controls.primaryColor.addEventListener('change', () => {
                    document.getElementById('colorPreview').style.background = this.controls.primaryColor.value;
                    this.updateBrushPreview();
                });

                this.updateAllControlDisplays();
            }

            initializeState() {
                this.isDrawing = false;
                this.isRecording = false;
                this.lastPos = { x: 0, y: 0 };
                this.currentPos = { x: 0, y: 0 };
                this.velocity = { x: 0, y: 0 };
                this.smoothedPos = { x: 0, y: 0 };
                
                // Statistics
                this.stats = {
                    totalStrokes: 0,
                    totalDistance: 0,
                    speeds: [],
                    strokeCount: 0
                };

                // SVG recording
                this.svgPaths = [];
                this.currentPath = '';

                // Particle system
                this.particles = [];
                
                // Animation frame tracking
                this.lastTime = 0;
            }

            initializePhysics() {
                this.time = 0;
                this.setupFading();
            }

            resizeCanvas() {
                const rect = document.querySelector('.canvas-area').getBoundingClientRect();
                
                [this.bgCanvas, this.drawCanvas].forEach(canvas => {
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                });

                this.previewCanvas.width = this.previewCanvas.offsetWidth;
                this.previewCanvas.height = this.previewCanvas.offsetHeight;

                // Redraw background
                this.drawBackground();
            }

            drawBackground() {
                const gradient = this.bgCtx.createRadialGradient(
                    this.bgCanvas.width / 2, this.bgCanvas.height / 2, 0,
                    this.bgCanvas.width / 2, this.bgCanvas.height / 2, Math.max(this.bgCanvas.width, this.bgCanvas.height) / 2
                );
                gradient.addColorStop(0, '#1a1a2e');
                gradient.addColorStop(0.5, '#16213e');
                gradient.addColorStop(1, '#0f3460');
                
                this.bgCtx.fillStyle = gradient;
                this.bgCtx.fillRect(0, 0, this.bgCanvas.width, this.bgCanvas.height);

                // Add subtle grid
                this.bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
                this.bgCtx.lineWidth = 1;
                
                for (let x = 0; x < this.bgCanvas.width; x += 50) {
                    this.bgCtx.beginPath();
                    this.bgCtx.moveTo(x, 0);
                    this.bgCtx.lineTo(x, this.bgCanvas.height);
                    this.bgCtx.stroke();
                }
                
                for (let y = 0; y < this.bgCanvas.height; y += 50) {
                    this.bgCtx.beginPath();
                    this.bgCtx.moveTo(0, y);
                    this.bgCtx.lineTo(this.bgCanvas.width, y);
                    this.bgCtx.stroke();
                }
            }

            setupEventListeners() {
                // Mouse events
                this.drawCanvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.drawCanvas.addEventListener('mousemove', (e) => this.draw(e));
                this.drawCanvas.addEventListener('mouseup', () => this.stopDrawing());
                this.drawCanvas.addEventListener('mouseout', () => this.stopDrawing());

                // Touch events for mobile
                this.drawCanvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.drawCanvas.dispatchEvent(mouseEvent);
                });

                this.drawCanvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.drawCanvas.dispatchEvent(mouseEvent);
                });

                this.drawCanvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const mouseEvent = new MouseEvent('mouseup', {});
                    this.drawCanvas.dispatchEvent(mouseEvent);
                });
            }

            getMousePos(e) {
                const rect = this.drawCanvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            startDrawing(e) {
                this.isDrawing = true;
                const pos = this.getMousePos(e);
                this.lastPos = { ...pos };
                this.currentPos = { ...pos };
                this.smoothedPos = { ...pos };
                this.velocity = { x: 0, y: 0 };
                
                this.stats.strokeCount++;
                this.stats.totalStrokes++;
                
                if (this.isRecording) {
                    this.currentPath = `M ${pos.x} ${pos.y}`;
                }

                this.updateStats();
            }

            draw(e) {
                if (!this.isDrawing) return;

                const pos = this.getMousePos(e);
                this.currentPos = { ...pos };

                // Calculate velocity and speed
                const dx = pos.x - this.lastPos.x;
                const dy = pos.y - this.lastPos.y;
                const speed = Math.sqrt(dx * dx + dy * dy);
                
                this.velocity.x = dx;
                this.velocity.y = dy;

                // Update statistics
                this.stats.totalDistance += speed;
                this.stats.speeds.push(speed);
                if (this.stats.speeds.length > 100) {
                    this.stats.speeds.shift();
                }

                // Apply smoothing
                const smoothing = parseFloat(this.controls.smoothing.value);
                this.smoothedPos.x += (pos.x - this.smoothedPos.x) * (1 - smoothing);
                this.smoothedPos.y += (pos.y - this.smoothedPos.y) * (1 - smoothing);

                // Apply turbulence
                const turbulence = parseFloat(this.controls.turbulence.value);
                if (turbulence > 0) {
                    this.smoothedPos.x += (Math.random() - 0.5) * turbulence;
                    this.smoothedPos.y += (Math.random() - 0.5) * turbulence;
                }

                // Draw based on selected mode
                this.drawWithMode(speed);

                // Record SVG path
                if (this.isRecording) {
                    this.currentPath += ` L ${this.smoothedPos.x} ${this.smoothedPos.y}`;
                }

                this.lastPos = { ...pos };
                this.updateStats();
            }

            drawWithMode(speed) {
                const mode = this.controls.drawingMode.value;
                
                switch (mode) {
                    case 'speed':
                        this.drawSpeedBased(speed);
                        break;
                    case 'pressure':
                        this.drawPressureBased(speed);
                        break;
                    case 'direction':
                        this.drawDirectionBased();
                        break;
                    case 'rainbow':
                        this.drawRainbow(speed);
                        break;
                    case 'particle':
                        this.drawParticleSystem(speed);
                        break;
                    case 'fractal':
                        this.drawFractalPattern(speed);
                        break;
                }
            }

            drawSpeedBased(speed) {
                const ctx = this.drawCtx;
                const speedFactor = parseFloat(this.controls.speedFactor.value);
                const normalizedSpeed = Math.min(speed * speedFactor / 10, 1);
                
                ctx.globalCompositeOperation = this.controls.blendMode.value;
                ctx.globalAlpha = parseFloat(this.controls.opacity.value) * (0.3 + normalizedSpeed * 0.7);
                
                const baseSize = parseFloat(this.controls.brushSize.value);
                const size = baseSize * (0.5 + normalizedSpeed);
                
                const color = this.hexToHsl(this.controls.primaryColor.value);
                color.l = Math.min(color.l + normalizedSpeed * 30, 90);
                color.s = Math.min(color.s + normalizedSpeed * 20, 100);
                
                ctx.strokeStyle = `hsl(${color.h}, ${color.s}%, ${color.l}%)`;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.beginPath();
                ctx.moveTo(this.lastPos.x, this.lastPos.y);
                ctx.lineTo(this.smoothedPos.x, this.smoothedPos.y);
                ctx.stroke();
            }

            drawPressureBased(speed) {
                const ctx = this.drawCtx;
                const pressure = Math.min(speed / 20, 1);
                
                ctx.globalCompositeOperation = this.controls.blendMode.value;
                ctx.globalAlpha = parseFloat(this.controls.opacity.value) * pressure;
                
                const size = parseFloat(this.controls.brushSize.value) * (0.2 + pressure * 0.8);
                
                ctx.fillStyle = this.controls.primaryColor.value;
                ctx.beginPath();
                ctx.arc(this.smoothedPos.x, this.smoothedPos.y, size / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            drawDirectionBased() {
                const ctx = this.drawCtx;
                const angle = Math.atan2(this.velocity.y, this.velocity.x);
                
                ctx.globalCompositeOperation = this.controls.blendMode.value;
                ctx.globalAlpha = parseFloat(this.controls.opacity.value);
                
                const hue = ((angle + Math.PI) / (Math.PI * 2)) * 360;
                ctx.strokeStyle = `hsl(${hue}, 70%, 60%)`;
                ctx.lineWidth = parseFloat(this.controls.brushSize.value);
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(this.lastPos.x, this.lastPos.y);
                ctx.lineTo(this.smoothedPos.x, this.smoothedPos.y);
                ctx.stroke();
            }

            drawRainbow(speed) {
                const ctx = this.drawCtx;
                this.time += speed * 0.01;
                
                ctx.globalCompositeOperation = this.controls.blendMode.value;
                ctx.globalAlpha = parseFloat(this.controls.opacity.value);
                
                const hue = (this.time * 50) % 360;
                ctx.strokeStyle = `hsl(${hue}, 80%, 60%)`;
                ctx.lineWidth = parseFloat(this.controls.brushSize.value);
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(this.lastPos.x, this.lastPos.y);
                ctx.lineTo(this.smoothedPos.x, this.smoothedPos.y);
                ctx.stroke();
            }

            drawParticleSystem(speed) {
                const numParticles = Math.floor(speed / 5) + 1;
                
                for (let i = 0; i < numParticles; i++) {
                    this.particles.push({
                        x: this.smoothedPos.x + (Math.random() - 0.5) * 20,
                        y: this.smoothedPos.y + (Math.random() - 0.5) * 20,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        life: 1.0,
                        size: Math.random() * parseFloat(this.controls.brushSize.value),
                        color: this.controls.primaryColor.value
                    });
                }
            }

            drawFractalPattern(speed) {
                const ctx = this.drawCtx;
                const branches = 3;
                const angle = Math.atan2(this.velocity.y, this.velocity.x);
                
                ctx.globalCompositeOperation = this.controls.blendMode.value;
                ctx.globalAlpha = parseFloat(this.controls.opacity.value) * 0.6;
                
                for (let i = 0; i < branches; i++) {
                    const branchAngle = angle + (i - 1) * Math.PI / 3;
                    const length = parseFloat(this.controls.brushSize.value) * 2;
                    
                    const endX = this.smoothedPos.x + Math.cos(branchAngle) * length;
                    const endY = this.smoothedPos.y + Math.sin(branchAngle) * length;
                    
                    ctx.strokeStyle = this.controls.primaryColor.value;
                    ctx.lineWidth = Math.max(1, parseFloat(this.controls.brushSize.value) / 3);
                    ctx.lineCap = 'round';
                    
                    ctx.beginPath();
                    ctx.moveTo(this.smoothedPos.x, this.smoothedPos.y);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                }
            }

            updateParticles() {
                const ctx = this.drawCtx;
                
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    p.size *= 0.99;
                    
                    if (p.life <= 0 || p.size < 0.1) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    
                    ctx.globalCompositeOperation = this.controls.blendMode.value;
                    ctx.globalAlpha = parseFloat(this.controls.opacity.value) * p.life;
                    ctx.fillStyle = p.color;
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            stopDrawing() {
                if (this.isDrawing && this.isRecording && this.currentPath) {
                    this.svgPaths.push({
                        path: this.currentPath,
                        color: this.controls.primaryColor.value,
                        width: parseFloat(this.controls.brushSize.value),
                        opacity: parseFloat(this.controls.opacity.value),
                        blendMode: this.controls.blendMode.value
                    });
                }
                
                this.isDrawing = false;
                this.currentPath = '';
            }

            setupFading() {
                const fadeRate = parseFloat(this.controls.fadeRate.value);
                if (fadeRate > 0) {
                    this.fadeInterval = setInterval(() => {
                        this.drawCtx.globalCompositeOperation = 'destination-out';
                        this.drawCtx.globalAlpha = fadeRate;
                        this.drawCtx.fillRect(0, 0, this.drawCanvas.width, this.drawCanvas.height);
                        this.drawCtx.globalCompositeOperation = 'source-over';
                    }, 50);
                } else if (this.fadeInterval) {
                    clearInterval(this.fadeInterval);
                    this.fadeInterval = null;
                }
            }

            startAnimationLoop() {
                const animate = (currentTime) => {
                    const deltaTime = currentTime - this.lastTime;
                    this.lastTime = currentTime;
                    
                    if (this.controls.drawingMode.value === 'particle') {
                        this.updateParticles();
                    }
                    
                    requestAnimationFrame(animate);
                };
                requestAnimationFrame(animate);
            }

            updateControlDisplay(controlName) {
                const control = this.controls[controlName];
                const valueDisplay = document.getElementById(controlName + 'Value');
                if (valueDisplay) {
                    let value = control.value;
                    if (controlName === 'opacity' || controlName === 'speedFactor' || 
                        controlName === 'smoothing' || controlName === 'fadeRate') {
                        value = parseFloat(value).toFixed(1);
                    }
                    valueDisplay.textContent = value;
                }
            }

            updateAllControlDisplays() {
                Object.keys(this.controls).forEach(key => {
                    this.updateControlDisplay(key);
                });
            }

            updateBrushPreview() {
                const ctx = this.previewCtx;
                const canvas = this.previewCanvas;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const size = parseFloat(this.controls.brushSize.value);
                const opacity = parseFloat(this.controls.opacity.value);
                
                ctx.globalAlpha = opacity;
                ctx.fillStyle = this.controls.primaryColor.value;
                
                const mode = this.controls.drawingMode.value;
                
                switch (mode) {
                    case 'speed':
                    case 'pressure':
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, size / 2, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'direction':
                        ctx.strokeStyle = this.controls.primaryColor.value;
                        ctx.lineWidth = size;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(centerX - 15, centerY);
                        ctx.lineTo(centerX + 15, centerY);
                        ctx.stroke();
                        break;
                    case 'rainbow':
                        const gradient = ctx.createLinearGradient(centerX - 20, centerY, centerX + 20, centerY);
                        gradient.addColorStop(0, 'hsl(0, 80%, 60%)');
                        gradient.addColorStop(0.5, 'hsl(180, 80%, 60%)');
                        gradient.addColorStop(1, 'hsl(360, 80%, 60%)');
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = size;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(centerX - 20, centerY);
                        ctx.lineTo(centerX + 20, centerY);
                        ctx.stroke();
                        break;
                    case 'particle':
                        for (let i = 0; i < 8; i++) {
                            const angle = (i / 8) * Math.PI * 2;
                            const x = centerX + Math.cos(angle) * 10;
                            const y = centerY + Math.sin(angle) * 10;
                            ctx.beginPath();
                            ctx.arc(x, y, size / 6, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    case 'fractal':
                        const branches = 3;
                        ctx.strokeStyle = this.controls.primaryColor.value;
                        ctx.lineWidth = size / 3;
                        ctx.lineCap = 'round';
                        
                        for (let i = 0; i < branches; i++) {
                            const angle = (i / branches) * Math.PI * 2;
                            const endX = centerX + Math.cos(angle) * 15;
                            const endY = centerY + Math.sin(angle) * 15;
                            
                            ctx.beginPath();
                            ctx.moveTo(centerX, centerY);
                            ctx.lineTo(endX, endY);
                            ctx.stroke();
                        }
                        break;
                }
            }

            updateStats() {
                document.getElementById('totalStrokes').textContent = this.stats.totalStrokes;
                
                const avgSpeed = this.stats.speeds.length > 0 
                    ? (this.stats.speeds.reduce((a, b) => a + b, 0) / this.stats.speeds.length).toFixed(1)
                    : '0';
                document.getElementById('avgSpeed').textContent = avgSpeed;
                
                const maxSpeed = this.stats.speeds.length > 0 
                    ? Math.max(...this.stats.speeds).toFixed(1)
                    : '0';
                document.getElementById('maxSpeed').textContent = maxSpeed;
                
                document.getElementById('distance').textContent = Math.floor(this.stats.totalDistance);
            }

            hexToHsl(hex) {
                const r = parseInt(hex.slice(1, 3), 16) / 255;
                const g = parseInt(hex.slice(3, 5), 16) / 255;
                const b = parseInt(hex.slice(5, 7), 16) / 255;

                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;

                if (max === min) {
                    h = s = 0;
                } else {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch (max) {
                        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                        case g: h = (b - r) / d + 2; break;
                        case b: h = (r - g) / d + 4; break;
                    }
                    h /= 6;
                }

                return { h: h * 360, s: s * 100, l: l * 100 };
            }
        }

        // Global functions for UI interactions
        let artGenerator;

        window.addEventListener('DOMContentLoaded', () => {
            artGenerator = new MouseArtGenerator();
        });

        function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const indicator = document.getElementById('recordingIndicator');
            
            artGenerator.isRecording = !artGenerator.isRecording;
            
            if (artGenerator.isRecording) {
                btn.textContent = '⏹️ Stop Recording';
                btn.className = 'danger-btn';
                indicator.classList.add('active');
                artGenerator.svgPaths = [];
            } else {
                btn.textContent = '🔴 Start Recording';
                btn.className = 'primary-btn';
                indicator.classList.remove('active');
            }
        }

        function clearCanvas() {
            if (confirm('Are you sure you want to clear the canvas? This action cannot be undone.')) {
                artGenerator.drawCtx.clearRect(0, 0, artGenerator.drawCanvas.width, artGenerator.drawCanvas.height);
                artGenerator.particles = [];
                artGenerator.stats = {
                    totalStrokes: 0,
                    totalDistance: 0,
                    speeds: [],
                    strokeCount: 0
                };
                artGenerator.updateStats();
                artGenerator.drawBackground();
            }
        }

        function saveArtwork() {
            // Create composite canvas
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = artGenerator.drawCanvas.width;
            tempCanvas.height = artGenerator.drawCanvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            // Draw background
            tempCtx.drawImage(artGenerator.bgCanvas, 0, 0);
            
            // Draw artwork
            tempCtx.drawImage(artGenerator.drawCanvas, 0, 0);
            
            // Download
            const link = document.createElement('a');
            link.download = `mouse-art-${Date.now()}.png`;
            link.href = tempCanvas.toDataURL();
            link.click();
        }

        function exportSVG() {
            if (artGenerator.svgPaths.length === 0) {
                alert('No recorded paths to export. Start recording and draw something first!');
                return;
            }

            let svgContent = `<svg width="${artGenerator.drawCanvas.width}" height="${artGenerator.drawCanvas.height}" xmlns="http://www.w3.org/2000/svg">`;
            
            // Add background
            svgContent += `<defs>
                <radialGradient id="bg" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#1a1a2e"/>
                    <stop offset="50%" style="stop-color:#16213e"/>
                    <stop offset="100%" style="stop-color:#0f3460"/>
                </radialGradient>
            </defs>`;
            svgContent += `<rect width="100%" height="100%" fill="url(#bg)"/>`;
            
            // Add paths
            artGenerator.svgPaths.forEach((pathData, index) => {
                svgContent += `<path d="${pathData.path}" 
                    stroke="${pathData.color}" 
                    stroke-width="${pathData.width}" 
                    stroke-opacity="${pathData.opacity}" 
                    fill="none" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    style="mix-blend-mode: ${pathData.blendMode}"/>`;
            });
            
            svgContent += '</svg>';
            
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.download = `mouse-art-vector-${Date.now()}.svg`;
            link.href = URL.createObjectURL(blob);
            link.click();
        }

        function applyPreset(presetName) {
            const presets = {
                neon: {
                    brushSize: 8,
                    opacity: 0.7,
                    drawingMode: 'speed',
                    primaryColor: '#00ffff',
                    blendMode: 'screen',
                    speedFactor: 2.0,
                    smoothing: 0.1,
                    turbulence: 0,
                    fadeRate: 0.02
                },
                watercolor: {
                    brushSize: 25,
                    opacity: 0.3,
                    drawingMode: 'pressure',
                    primaryColor: '#4a90e2',
                    blendMode: 'multiply',
                    speedFactor: 0.5,
                    smoothing: 0.7,
                    turbulence: 3,
                    fadeRate: 0
                },
                lightning: {
                    brushSize: 3,
                    opacity: 0.9,
                    drawingMode: 'fractal',
                    primaryColor: '#ffffff',
                    blendMode: 'color-dodge',
                    speedFactor: 3.0,
                    smoothing: 0.0,
                    turbulence: 8,
                    fadeRate: 0.05
                },
                galaxy: {
                    brushSize: 12,
                    opacity: 0.6,
                    drawingMode: 'particle',
                    primaryColor: '#9b59b6',
                    blendMode: 'overlay',
                    speedFactor: 1.5,
                    smoothing: 0.4,
                    turbulence: 2,
                    fadeRate: 0.01
                }
            };

            const preset = presets[presetName];
            if (!preset) return;

            // Apply preset values
            Object.keys(preset).forEach(key => {
                if (artGenerator.controls[key]) {
                    artGenerator.controls[key].value = preset[key];
                    artGenerator.updateControlDisplay(key);
                }
            });

            // Update color preview
            document.getElementById('colorPreview').style.background = preset.primaryColor;
            
            // Setup fading and update brush preview
            artGenerator.setupFading();
            artGenerator.updateBrushPreview();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        // Performance monitoring
        let frameCount = 0;
        let lastFpsTime = performance.now();

        function monitorPerformance() {
            frameCount++;
            const now = performance.now();
            
            if (now - lastFpsTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                
                // Auto-adjust quality based on performance
                if (fps < 30 && artGenerator) {
                    // Reduce particle count or simplify rendering
                    if (artGenerator.particles.length > 50) {
                        artGenerator.particles = artGenerator.particles.slice(0, 50);
                    }
                }
                
                frameCount = 0;
                lastFpsTime = now;
            }
            
            requestAnimationFrame(monitorPerformance);
        }

        // Start performance monitoring
        requestAnimationFrame(monitorPerformance);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 's':
                        e.preventDefault();
                        saveArtwork();
                        break;
                    case 'z':
                        e.preventDefault();
                        if (e.shiftKey) {
                            // Redo functionality could be added here
                        } else {
                            // Undo functionality could be added here
                        }
                        break;
                    case 'r':
                        e.preventDefault();
                        toggleRecording();
                        break;
                }
            }
            
            switch (e.key) {
                case 'Escape':
                    if (artGenerator.isDrawing) {
                        artGenerator.stopDrawing();
                    }
                    break;
                case ' ':
                    e.preventDefault();
                    clearCanvas();
                    break;
            }
        });

        // Add helpful tooltips and instructions
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (window.innerWidth > 768) {
                    // Show brief tutorial for desktop users
                    const tutorial = document.createElement('div');
                    tutorial.innerHTML = `
                        <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                                    background: rgba(0,0,0,0.9); color: white; padding: 20px; 
                                    border-radius: 10px; z-index: 10000; max-width: 400px; text-align: center;">
                            <h3>🎨 Welcome to Mouse Art Generator!</h3>
                            <p style="margin: 10px 0;">• Move your mouse while clicking to create art</p>
                            <p style="margin: 10px 0;">• Try different drawing modes and presets</p>
                            <p style="margin: 10px 0;">• Use Ctrl+S to save, Ctrl+R to record</p>
                            <button onclick="this.parentElement.parentElement.remove()" 
                                    style="margin-top: 15px; padding: 8px 16px; background: #667eea; 
                                           color: white; border: none; border-radius: 5px; cursor: pointer;">
                                Got it!
                            </button>
                        </div>
                    `;
                    document.body.appendChild(tutorial);
                    
                    setTimeout(() => {
                        if (tutorial.parentElement) {
                            tutorial.remove();
                        }
                    }, 8000);
                }
            }, 1000);
        });
    </script>
