<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MouseFlow - Professional Art Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0a0a;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 40%, #0f0f23 100%);
        }

        .sidebar {
            width: 320px;
            background: linear-gradient(135deg, rgba(15, 15, 35, 0.98) 0%, rgba(26, 26, 46, 0.95) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            border-right: 1px solid rgba(100, 255, 218, 0.1);
            padding: 24px;
            color: white;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 2px 0 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 255, 218, 0.3), transparent);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #64ffda, #00e5ff, #1de9b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            position: relative;
            padding-bottom: 16px;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #64ffda, transparent);
            border-radius: 2px;
        }

        .control-group {
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(100, 255, 218, 0.08);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-group:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(100, 255, 218, 0.15);
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .control-group h3 {
            font-size: 13px;
            color: #64ffda;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group h3::before {
            content: '';
            width: 3px;
            height: 3px;
            background: #64ffda;
            border-radius: 50%;
        }

        .slider-container {
            margin-bottom: 18px;
            position: relative;
        }

        .slider-container label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #e1e5e9;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #1a1a2e, #2d2d4a);
            outline: none;
            -webkit-appearance: none;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64ffda, #00e5ff);
            cursor: pointer;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 12px rgba(100, 255, 218, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(100, 255, 218, 0.4);
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .mode-btn {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.15);
            border-radius: 8px;
            color: #e1e5e9;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(100, 255, 218, 0.1), transparent);
            transition: left 0.5s;
        }

        .mode-btn:hover::before {
            left: 100%;
        }

        .mode-btn:hover {
            background: rgba(100, 255, 218, 0.1);
            border-color: rgba(100, 255, 218, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(100, 255, 218, 0.2);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, rgba(100, 255, 218, 0.2), rgba(0, 229, 255, 0.15));
            border-color: #64ffda;
            color: #64ffda;
            box-shadow: 0 4px 16px rgba(100, 255, 218, 0.3);
        }

        .action-btn {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, rgba(100, 255, 218, 0.1), rgba(0, 229, 255, 0.05));
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 12px;
            color: #64ffda;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(100, 255, 218, 0.3), transparent);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
        }

        .action-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(100, 255, 218, 0.25);
            border-color: rgba(100, 255, 218, 0.5);
            background: linear-gradient(135deg, rgba(100, 255, 218, 0.15), rgba(0, 229, 255, 0.1));
        }

        .action-btn:active {
            transform: translateY(-1px);
            transition: transform 0.1s;
        }

        .clear-btn {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(255, 56, 56, 0.05));
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .clear-btn:hover {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(255, 56, 56, 0.1));
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow: 0 12px 40px rgba(255, 107, 107, 0.25);
        }

        .stats {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(100, 255, 218, 0.02));
            border: 1px solid rgba(100, 255, 218, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
            backdrop-filter: blur(15px);
            position: relative;
        }

        .stats::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 255, 218, 0.3), transparent);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            padding: 8px 0;
        }

        .stat-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
        }

        .stat-item span:first-child {
            color: #a0a9b8;
            font-weight: 500;
        }

        .stat-item span:last-child {
            color: #64ffda;
            font-weight: 700;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(ellipse at center, rgba(26, 26, 46, 0.3) 0%, rgba(15, 15, 35, 0.8) 70%, #0a0a0a 100%);
        }

        #artCanvas {
            cursor: crosshair;
            display: block;
            background: transparent;
            transition: filter 0.3s ease;
        }

        #artCanvas:hover {
            filter: brightness(1.05);
        }

        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: linear-gradient(135deg, rgba(15, 15, 35, 0.95), rgba(26, 26, 46, 0.9));
            backdrop-filter: blur(20px) saturate(180%);
            color: #64ffda;
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid rgba(100, 255, 218, 0.2);
            opacity: 0;
            transform: translateY(-20px) scale(0.9);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .color-harmony {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .harmony-color {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .harmony-color::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .harmony-color:hover::before {
            opacity: 1;
        }

        .harmony-color:hover {
            transform: scale(1.15) rotate(5deg);
            border-color: rgba(100, 255, 218, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .recording-indicator {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.9), rgba(255, 56, 56, 0.8));
            backdrop-filter: blur(15px);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transform: translateX(-50%) translateY(-10px) scale(0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.3);
        }

        .recording-indicator.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { 
                opacity: 1;
                box-shadow: 0 8px 32px rgba(255, 107, 107, 0.3);
            }
            50% { 
                opacity: 0.8;
                box-shadow: 0 8px 32px rgba(255, 107, 107, 0.6);
            }
        }

        .brush-preview {
            width: 80px;
            height: 80px;
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 16px;
            margin: 16px auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.5), rgba(15, 15, 35, 0.3));
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .brush-preview:hover {
            border-color: rgba(100, 255, 218, 0.4);
            transform: scale(1.05);
        }

        .brush-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(100, 255, 218, 0.1), transparent);
            transition: left 0.6s;
        }

        .brush-preview:hover::before {
            left: 100%;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: fixed;
                top: 0;
                left: -100%;
                transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 100;
                backdrop-filter: blur(30px) saturate(180%);
            }
            
            .sidebar.open {
                left: 0;
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            }

            .app-container {
                background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f23 70%);
            }

            .canvas-container {
                width: 100%;
            }

            .toast {
                right: 16px;
                top: 16px;
                left: 16px;
                right: 16px;
                width: auto;
            }
        }

        /* Add subtle animations for better feedback */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .control-group {
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .control-group:nth-child(2) { animation-delay: 0.1s; }
        .control-group:nth-child(3) { animation-delay: 0.2s; }
        .control-group:nth-child(4) { animation-delay: 0.3s; }
        .control-group:nth-child(5) { animation-delay: 0.4s; }
        .control-group:nth-child(6) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="logo">MouseFlow Studio</div>
            
            <div class="control-group">
                <h3>Brush Settings</h3>
                <div class="slider-container">
                    <label>Brush Size: <span id="brushSizeValue">15</span>px</label>
                    <input type="range" id="brushSize" min="1" max="50" value="15">
                </div>
                <div class="slider-container">
                    <label>Opacity: <span id="opacityValue">80</span>%</label>
                    <input type="range" id="opacity" min="10" max="100" value="80">
                </div>
                <div class="brush-preview" id="brushPreview"></div>
            </div>

            <div class="control-group">
                <h3>Drawing Mode</h3>
                <div class="mode-selector">
                    <div class="mode-btn active" data-mode="flow">Flow</div>
                    <div class="mode-btn" data-mode="burst">Burst</div>
                    <div class="mode-btn" data-mode="trail">Trail</div>
                    <div class="mode-btn" data-mode="spiral">Spiral</div>
                </div>
            </div>

            <div class="control-group">
                <h3>Speed Sensitivity</h3>
                <div class="slider-container">
                    <label>Speed Factor: <span id="speedFactorValue">2.0</span>x</label>
                    <input type="range" id="speedFactor" min="0.5" max="5" step="0.1" value="2">
                </div>
                <div class="slider-container">
                    <label>Color Shift: <span id="colorShiftValue">50</span>%</label>
                    <input type="range" id="colorShift" min="0" max="100" value="50">
                </div>
            </div>

            <div class="control-group">
                <h3>Color Harmony</h3>
                <div class="color-harmony" id="colorHarmony"></div>
            </div>

            <div class="control-group">
                <h3>Actions</h3>
                <button class="action-btn" id="saveBtn">Export as PNG</button>
                <button class="action-btn" id="saveSvgBtn">Export as SVG</button>
                <button class="action-btn clear-btn" id="clearBtn">Clear Canvas</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span>Strokes:</span>
                    <span id="strokeCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Distance:</span>
                    <span id="totalDistance">0px</span>
                </div>
                <div class="stat-item">
                    <span>Avg Speed:</span>
                    <span id="avgSpeed">0px/s</span>
                </div>
                <div class="stat-item">
                    <span>Max Speed:</span>
                    <span id="maxSpeed">0px/s</span>
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="artCanvas"></canvas>
            <div class="recording-indicator" id="recordingIndicator">● Recording Movement</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        class MouseArtGenerator {
            constructor() {
                this.canvas = document.getElementById('artCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.isDrawing = false;
                this.lastPos = { x: 0, y: 0 };
                this.lastTime = 0;
                this.currentSpeed = 0;
                this.maxSpeed = 0;
                this.totalDistance = 0;
                this.strokeCount = 0;
                this.speeds = [];
                this.svgElements = [];
                
                this.settings = {
                    brushSize: 15,
                    opacity: 0.8,
                    mode: 'flow',
                    speedFactor: 2.0,
                    colorShift: 50
                };

                this.colorHarmonies = [
                    ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b'],
                    ['#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e', '#e17055'],
                    ['#00b894', '#00cec9', '#0984e3', '#6c5ce7', '#a29bfe'],
                    ['#e84393', '#fd79a8', '#fdcb6e', '#e17055', '#d63031']
                ];
                
                this.currentHarmony = this.colorHarmonies[0];
                
                this.init();
            }

            init() {
                this.setupCanvas();
                this.setupEventListeners();
                this.setupColorHarmony();
                this.updateBrushPreview();
                this.animate();
            }

            setupCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
                
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                
                window.addEventListener('resize', () => {
                    const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                    this.canvas.width = container.clientWidth;
                    this.canvas.height = container.clientHeight;
                    this.ctx.putImageData(imageData, 0, 0);
                });
            }

            setupEventListeners() {
                // Canvas events
                this.canvas.addEventListener('mousedown', this.startDrawing.bind(this));
                this.canvas.addEventListener('mousemove', this.draw.bind(this));
                this.canvas.addEventListener('mouseup', this.stopDrawing.bind(this));
                this.canvas.addEventListener('mouseout', this.stopDrawing.bind(this));

                // Touch events for mobile
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const mouseEvent = new MouseEvent('mouseup', {});
                    this.canvas.dispatchEvent(mouseEvent);
                });

                // Control events
                document.getElementById('brushSize').addEventListener('input', (e) => {
                    this.settings.brushSize = parseInt(e.target.value);
                    document.getElementById('brushSizeValue').textContent = e.target.value;
                    this.updateBrushPreview();
                });

                document.getElementById('opacity').addEventListener('input', (e) => {
                    this.settings.opacity = parseInt(e.target.value) / 100;
                    document.getElementById('opacityValue').textContent = e.target.value;
                    this.updateBrushPreview();
                });

                document.getElementById('speedFactor').addEventListener('input', (e) => {
                    this.settings.speedFactor = parseFloat(e.target.value);
                    document.getElementById('speedFactorValue').textContent = e.target.value;
                });

                document.getElementById('colorShift').addEventListener('input', (e) => {
                    this.settings.colorShift = parseInt(e.target.value);
                    document.getElementById('colorShiftValue').textContent = e.target.value;
                });

                // Mode selection
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.settings.mode = e.target.dataset.mode;
                    });
                });

                // Action buttons
                document.getElementById('saveBtn').addEventListener('click', () => this.exportPNG());
                document.getElementById('saveSvgBtn').addEventListener('click', () => this.exportSVG());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearCanvas());
            }

            setupColorHarmony() {
                const container = document.getElementById('colorHarmony');
                this.currentHarmony.forEach((color, index) => {
                    const colorDiv = document.createElement('div');
                    colorDiv.className = 'harmony-color';
                    colorDiv.style.backgroundColor = color;
                    colorDiv.addEventListener('click', () => {
                        this.currentHarmony = this.colorHarmonies[Math.floor(Math.random() * this.colorHarmonies.length)];
                        this.setupColorHarmony();
                    });
                    container.appendChild(colorDiv);
                });
            }

            updateBrushPreview() {
                const preview = document.getElementById('brushPreview');
                const size = Math.min(this.settings.brushSize * 2, 50);
                const color = this.currentHarmony[0];
                preview.innerHTML = `<div style="
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    border-radius: 50%;
                    margin: auto;
                    margin-top: ${(60 - size) / 2}px;
                    opacity: ${this.settings.opacity};
                "></div>`;
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            calculateSpeed(pos, time) {
                if (!this.lastPos || !this.lastTime) return 0;
                
                const dx = pos.x - this.lastPos.x;
                const dy = pos.y - this.lastPos.y;
                const dt = time - this.lastTime;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                return dt > 0 ? distance / dt * 16.67 : 0; // Normalize to ~60fps
            }

            getColorFromSpeed(speed) {
                const normalizedSpeed = Math.min(speed / 20, 1);
                const colorIndex = Math.floor(normalizedSpeed * (this.currentHarmony.length - 1));
                const nextColorIndex = Math.min(colorIndex + 1, this.currentHarmony.length - 1);
                const factor = (normalizedSpeed * (this.currentHarmony.length - 1)) % 1;
                
                return this.interpolateColor(
                    this.currentHarmony[colorIndex],
                    this.currentHarmony[nextColorIndex],
                    factor
                );
            }

            interpolateColor(color1, color2, factor) {
                const rgb1 = this.hexToRgb(color1);
                const rgb2 = this.hexToRgb(color2);
                
                const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * factor);
                const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * factor);
                const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * factor);
                
                return `rgb(${r}, ${g}, ${b})`;
            }

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }

            startDrawing(e) {
                this.isDrawing = true;
                const pos = this.getMousePos(e);
                this.lastPos = pos;
                this.lastTime = Date.now();
                this.strokeCount++;
                
                document.getElementById('recordingIndicator').classList.add('active');
                this.updateStats();
            }

            draw(e) {
                if (!this.isDrawing) return;

                const pos = this.getMousePos(e);
                const time = Date.now();
                const speed = this.calculateSpeed(pos, time);
                
                this.currentSpeed = speed;
                this.maxSpeed = Math.max(this.maxSpeed, speed);
                this.speeds.push(speed);
                
                if (this.lastPos) {
                    const dx = pos.x - this.lastPos.x;
                    const dy = pos.y - this.lastPos.y;
                    this.totalDistance += Math.sqrt(dx * dx + dy * dy);
                }

                this.drawBrush(pos, speed);
                
                this.lastPos = pos;
                this.lastTime = time;
                this.updateStats();
            }

            drawBrush(pos, speed) {
                const color = this.getColorFromSpeed(speed * this.settings.speedFactor);
                const size = this.settings.brushSize + (speed * 0.5);
                
                this.ctx.globalAlpha = this.settings.opacity;
                
                switch (this.settings.mode) {
                    case 'flow':
                        this.drawFlow(pos, color, size);
                        break;
                    case 'burst':
                        this.drawBurst(pos, color, size, speed);
                        break;
                    case 'trail':
                        this.drawTrail(pos, color, size);
                        break;
                    case 'spiral':
                        this.drawSpiral(pos, color, size, speed);
                        break;
                }
            }

            drawFlow(pos, color, size) {
                this.ctx.beginPath();
                this.ctx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
                this.ctx.fillStyle = color;
                this.ctx.fill();
                
                if (this.lastPos) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.lastPos.x, this.lastPos.y);
                    this.ctx.lineTo(pos.x, pos.y);
                    this.ctx.strokeStyle = color;
                    this.ctx.lineWidth = size;
                    this.ctx.stroke();
                }
            }

            drawBurst(pos, color, size, speed) {
                const particles = Math.floor(speed / 2) + 1;
                for (let i = 0; i < particles; i++) {
                    const angle = (Math.PI * 2 / particles) * i;
                    const radius = Math.random() * size;
                    const x = pos.x + Math.cos(angle) * radius;
                    const y = pos.y + Math.sin(angle) * radius;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, Math.random() * size / 4 + 1, 0, Math.PI * 2);
                    this.ctx.fillStyle = color;
                    this.ctx.fill();
                }
            }

            drawTrail(pos, color, size) {
                if (!this.lastPos) return;
                
                const trailLength = 5;
                for (let i = 0; i < trailLength; i++) {
                    const factor = i / trailLength;
                    const x = this.lastPos.x + (pos.x - this.lastPos.x) * factor;
                    const y = this.lastPos.y + (pos.y - this.lastPos.y) * factor;
                    const trailSize = size * (1 - factor * 0.8);
                    
                    this.ctx.globalAlpha = this.settings.opacity * (1 - factor * 0.7);
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, trailSize / 2, 0, Math.PI * 2);
                    this.ctx.fillStyle = color;
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = this.settings.opacity;
            }

            drawSpiral(pos, color, size, speed) {
                const spiralRadius = size * 2;
                const spiralTurns = speed / 10 + 1;
                
                this.ctx.beginPath();
                for (let i = 0; i < spiralTurns * 20; i++) {
                    const angle = (i / 20) * Math.PI * 2;
                    const radius = (i / (spiralTurns * 20)) * spiralRadius;
                    const x = pos.x + Math.cos(angle) * radius;
                    const y = pos.y + Math.sin(angle) * radius;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
            }

            stopDrawing() {
                this.isDrawing = false;
                this.lastPos = null;
                this.lastTime = 0;
                document.getElementById('recordingIndicator').classList.remove('active');
            }

            updateStats() {
                document.getElementById('strokeCount').textContent = this.strokeCount;
                document.getElementById('totalDistance').textContent = Math.round(this.totalDistance) + 'px';
                
                const avgSpeed = this.speeds.length > 0 ? 
                    this.speeds.reduce((a, b) => a + b, 0) / this.speeds.length : 0;
                document.getElementById('avgSpeed').textContent = Math.round(avgSpeed) + 'px/s';
                document.getElementById('maxSpeed').textContent = Math.round(this.maxSpeed) + 'px/s';
            }

            clearCanvas() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.strokeCount = 0;
                this.totalDistance = 0;
                this.maxSpeed = 0;
                this.speeds = [];
                this.svgElements = [];
                this.updateStats();
                this.showToast('Canvas cleared');
            }

            exportPNG() {
                const link = document.createElement('a');
                link.download = `mouseflow-art-${Date.now()}.png`;
                link.href = this.canvas.toDataURL();
                link.click();
                this.showToast('PNG exported successfully');
            }

            exportSVG() {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', this.canvas.width);
                svg.setAttribute('height', this.canvas.height);
                svg.setAttribute('viewBox', `0 0 ${this.canvas.width} ${this.canvas.height}`);
                
                // Convert canvas to SVG (simplified approach)
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('width', '100%');
                rect.setAttribute('height', '100%');
                rect.setAttribute('fill', 'transparent');
                svg.appendChild(rect);
                
                const image = document.createElementNS('http://www.w3.org/2000/svg', 'image');
                image.setAttribute('href', this.canvas.toDataURL());
                image.setAttribute('width', this.canvas.width);
                image.setAttribute('height', this.canvas.height);
                svg.appendChild(image);
                
                const svgData = new XMLSerializer().serializeToString(svg);
                const blob = new Blob([svgData], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.download = `mouseflow-art-${Date.now()}.svg`;
                link.href = url;
                link.click();
                
                URL.revokeObjectURL(url);
                this.showToast('SVG exported successfully');
            }

            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            animate() {
                // Add subtle background animation
                const time = Date.now() * 0.001;
                const gradient = this.ctx.createRadialGradient(
                    this.canvas.width / 2 + Math.sin(time) * 100,
                    this.canvas.height / 2 + Math.cos(time) * 100,
                    0,
                    this.canvas.width / 2,
                    this.canvas.height / 2,
                    Math.max(this.canvas.width, this.canvas.height)
                );
                
                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize the application
        window.addEventListener('DOMContentLoaded', () => {
            new MouseArtGenerator();
        });
    </script>
</body>
