<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MouseFlow Pro | Adobe Creative Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #FF0050;
            --primary-light: #FF1B5E;
            --primary-dark: #E6004A;
            --secondary: #001AFF;
            --secondary-light: #3347FF;
            --accent: #00FFD1;
            --accent-dark: #00E6BC;
            --bg-primary: #000000;
            --bg-secondary: #0A0A0A;
            --bg-tertiary: #141414;
            --surface: #1A1A1A;
            --surface-light: #262626;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --text-tertiary: #666666;
            --border: #333333;
            --border-light: #404040;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6);
            --glow-primary: 0 0 20px rgba(255, 0, 80, 0.5);
            --glow-accent: 0 0 20px rgba(0, 255, 209, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at 20% 20%, rgba(255, 0, 80, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 26, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 40% 60%, rgba(0, 255, 209, 0.08) 0%, transparent 50%),
                        var(--bg-primary);
        }

        /* Sidebar */
        .sidebar {
            width: 360px;
            background: linear-gradient(180deg, 
                rgba(26, 26, 26, 0.98) 0%, 
                rgba(20, 20, 20, 0.95) 50%,
                rgba(16, 16, 16, 0.98) 100%);
            backdrop-filter: blur(40px) saturate(180%);
            border-right: 1px solid var(--border);
            padding: 32px 28px;
            overflow-y: auto;
            z-index: 100;
            position: relative;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                var(--accent) 20%, 
                var(--primary) 50%, 
                var(--secondary) 80%, 
                transparent 100%);
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 3px;
        }

        /* Logo */
        .logo {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 40px;
            background: linear-gradient(135deg, 
                var(--primary) 0%, 
                var(--accent) 50%, 
                var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo::before {
            content: '';
            width: 32px;
            height: 32px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border-radius: 8px;
            box-shadow: var(--glow-primary);
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { box-shadow: var(--glow-primary); }
            100% { box-shadow: var(--glow-accent); }
        }

        /* Control Groups */
        .control-group {
            margin-bottom: 32px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.05) 0%, 
                rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
        }

        .control-group::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--accent), 
                transparent);
            transition: left 0.8s ease;
        }

        .control-group:hover {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.08) 0%, 
                rgba(255, 255, 255, 0.04) 100%);
            border-color: var(--border-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .control-group:hover::before {
            left: 100%;
        }

        .control-group h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-group h3::before {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        /* Sliders */
        .slider-container {
            margin-bottom: 20px;
            position: relative;
        }

        .slider-container label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .slider-container label span {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, 
                var(--bg-tertiary) 0%, 
                var(--surface) 50%, 
                var(--bg-tertiary) 100%);
            outline: none;
            -webkit-appearance: none;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        input[type="range"]:hover {
            background: linear-gradient(90deg, 
                var(--surface) 0%, 
                var(--surface-light) 50%, 
                var(--surface) 100%);
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            cursor: pointer;
            border: 3px solid var(--text-primary);
            box-shadow: var(--shadow-sm), var(--glow-primary);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: var(--shadow-md), var(--glow-accent);
        }

        /* Mode Selector */
        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 16px 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.1), 
                transparent);
            transition: left 0.6s ease;
        }

        .mode-btn:hover {
            background: var(--surface);
            border-color: var(--border-light);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .mode-btn:hover::before {
            left: 100%;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            color: var(--text-primary);
            box-shadow: var(--glow-primary);
            transform: translateY(-1px);
        }

        /* Action Buttons */
        .action-btn {
            width: 100%;
            padding: 18px 24px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, 
                var(--surface) 0%, 
                var(--surface-light) 100%);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, 
                rgba(255, 255, 255, 0.2), 
                transparent 70%);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .action-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, 
                var(--primary) 0%, 
                var(--primary-light) 100%);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg), var(--glow-primary);
        }

        .action-btn:active {
            transform: translateY(-1px);
            transition: transform 0.1s;
        }

        .clear-btn {
            background: linear-gradient(135deg, 
                rgba(230, 0, 74, 0.2) 0%, 
                rgba(255, 27, 94, 0.1) 100%);
            border-color: var(--primary-dark);
            color: var(--primary-light);
        }

        .clear-btn:hover {
            background: linear-gradient(135deg, 
                var(--primary-dark) 0%, 
                var(--primary) 100%);
            color: var(--text-primary);
        }

        /* Stats */
        .stats {
            background: linear-gradient(135deg, 
                rgba(0, 255, 209, 0.05) 0%, 
                rgba(0, 26, 255, 0.05) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-top: 32px;
            position: relative;
            overflow: hidden;
        }

        .stats::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--accent), 
                var(--secondary), 
                transparent);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 14px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
        }

        .stat-item span:first-child {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-item span:last-child {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-family: 'Inter', monospace;
            font-size: 16px;
        }

        /* Canvas Container */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-primary);
        }

        #artCanvas {
            cursor: crosshair;
            display: block;
            background: transparent;
            transition: filter 0.3s ease;
        }

        #artCanvas:hover {
            filter: brightness(1.02) saturate(1.1);
        }

        /* Color Harmony */
        .color-harmony {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .harmony-color {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .harmony-color::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.2), 
                transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .harmony-color:hover {
            transform: scale(1.15) rotate(8deg);
            border-color: var(--text-primary);
            box-shadow: var(--shadow-md);
        }

        .harmony-color:hover::before {
            opacity: 1;
        }

        /* Recording Indicator */
        .recording-indicator {
            position: absolute;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, 
                var(--primary) 0%, 
                var(--primary-light) 100%);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            transform: translateX(-50%) translateY(-20px) scale(0.8);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid var(--primary-light);
            box-shadow: var(--shadow-lg), var(--glow-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .recording-indicator.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            animation: recordingPulse 2s infinite ease-in-out;
        }

        @keyframes recordingPulse {
            0%, 100% { 
                opacity: 1;
                box-shadow: var(--shadow-lg), var(--glow-primary);
            }
            50% { 
                opacity: 0.8;
                box-shadow: var(--shadow-lg), 0 0 40px rgba(255, 0, 80, 0.8);
            }
        }

        /* Brush Preview */
        .brush-preview {
            width: 88px;
            height: 88px;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, 
                var(--bg-tertiary) 0%, 
                var(--surface) 100%);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .brush-preview:hover {
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: var(--glow-accent);
        }

        .brush-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 255, 209, 0.2), 
                transparent);
            transition: left 0.8s ease;
        }

        .brush-preview:hover::before {
            left: 100%;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 32px;
            right: 32px;
            background: linear-gradient(135deg, 
                var(--surface) 0%, 
                var(--surface-light) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            color: var(--text-primary);
            padding: 20px 28px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            opacity: 0;
            transform: translateY(-30px) scale(0.9);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1000;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-lg);
            min-width: 200px;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                width: 320px;
                padding: 24px 20px;
            }
            
            .logo {
                font-size: 28px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: fixed;
                top: 0;
                left: -100%;
                height: 100vh;
                transition: left 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                z-index: 200;
                backdrop-filter: blur(50px) saturate(200%);
            }
            
            .sidebar.open {
                left: 0;
                box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
            }

            .canvas-container {
                width: 100%;
            }

            .toast {
                left: 16px;
                right: 16px;
                top: 16px;
            }

            .mode-selector {
                grid-template-columns: 1fr;
            }
        }

        /* Advanced Animations */
        @keyframes slideInFromLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .control-group {
            animation: slideInFromLeft 0.8s ease-out backwards;
        }

        .control-group:nth-child(2) { animation-delay: 0.1s; }
        .control-group:nth-child(3) { animation-delay: 0.2s; }
        .control-group:nth-child(4) { animation-delay: 0.3s; }
        .control-group:nth-child(5) { animation-delay: 0.4s; }
        .control-group:nth-child(6) { animation-delay: 0.5s; }
        .control-group:nth-child(7) { animation-delay: 0.6s; }

        /* Performance Optimizations */
        .sidebar,
        .canvas-container,
        .control-group {
            will-change: transform;
        }

        /* Focus States for Accessibility */
        input[type="range"]:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .mode-btn:focus,
        .action-btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="logo">MouseFlow Pro</div>
            
            <div class="control-group">
                <h3>Brush Engine</h3>
                <div class="slider-container">
                    <label>Brush Size <span id="brushSizeValue">15</span></label>
                    <input type="range" id="brushSize" min="1" max="50" value="15">
                </div>
                <div class="slider-container">
                    <label>Opacity <span id="opacityValue">80%</span></label>
                    <input type="range" id="opacity" min="10" max="100" value="80">
                </div>
                <div class="brush-preview" id="brushPreview"></div>
            </div>

            <div class="control-group">
                <h3>Render Mode</h3>
                <div class="mode-selector">
                    <div class="mode-btn active" data-mode="flow">Flow</div>
                    <div class="mode-btn" data-mode="burst">Burst</div>
                    <div class="mode-btn" data-mode="trail">Trail</div>
                    <div class="mode-btn" data-mode="spiral">Spiral</div>
                </div>
            </div>

            <div class="control-group">
                <h3>Motion Dynamics</h3>
                <div class="slider-container">
                    <label>Speed Multiplier <span id="speedFactorValue">2.0x</span></label>
                    <input type="range" id="speedFactor" min="0.5" max="5" step="0.1" value="2">
                </div>
                <div class="slider-container">
                    <label>Color Velocity <span id="colorShiftValue">50%</span></label>
                    <input type="range" id="colorShift" min="0" max="100" value="50">
                </div>
            </div>

            <div class="control-group">
                <h3>Color Palette</h3>
                <div class="color-harmony" id="colorHarmony"></div>
            </div>

            <div class="control-group">
                <h3>Export & Actions</h3>
                <button class="action-btn" id="saveBtn">Export PNG</button>
                <button class="action-btn" id="saveSvgBtn">Export SVG</button>
                <button class="action-btn clear-btn" id="clearBtn">Clear Canvas</button>
                <button class="action-btn" id="recordBtn">Record Session</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span>Total Strokes</span>
                    <span id="strokeCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Path Distance</span>
                    <span id="totalDistance">0px</span>
                </div>
                <div class="stat-item">
                    <span>Avg Velocity</span>
                    <span id="avgSpeed">0px/s</span>
                </div>
                <div class="stat-item">
                    <span>Peak Velocity</span>
                    <span id="maxSpeed">0px/s</span>
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="artCanvas"></canvas>
            <div class="recording-indicator" id="recordingIndicator">● Recording Motion</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        class MouseArtGenerator {
            constructor() {
                // Canvas setup
                this.canvas = document.getElementById('artCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.isDrawing = false;
                this.lastPos = { x: 0, y: 0 };
                this.lastTime = 0;
                this.currentSpeed = 0;
                this.maxSpeed = 0;
                this.totalDistance = 0;
                this.strokeCount = 0;
                this.speeds = [];
                this.svgElements = [];
                this.isRecording = false;
                this.recordingData = [];
                
                // Settings with default values
                this.settings = {
                    brushSize: 15,
                    opacity: 0.8,
                    mode: 'flow',
                    speedFactor: 2.0,
                    colorShift: 50
                };

                // Color harmonies
                this.colorHarmonies = [
                    ['#FF0050', '#FF1B5E', '#001AFF', '#3347FF', '#00FFD1'],
                    ['#8B5CF6', '#A78BFA', '#EC4899', '#F472B6', '#F59E0B'],
                    ['#10B981', '#34D399', '#3B82F6', '#60A5FA', '#8B5CF6'],
                    ['#EF4444', '#F87171', '#F59E0B', '#FBBF24', '#10B981']
                ];
                
                // Current color harmony
                this.currentHarmony = this.colorHarmonies[0];
                
                // Initialize application
                this.init();
            }

            init() {
                // Setup canvas
                this.setupCanvas();
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Setup color harmony UI
                this.setupColorHarmony();
                
                // Update brush preview
                this.updateBrushPreview();
                
                // Start animation loop
                this.animate();
            }

            setupCanvas() {
                // Set canvas to full container size
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
                
                // Set canvas drawing properties
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                    this.canvas.width = container.clientWidth;
                    this.canvas.height = container.clientHeight;
                    this.ctx.putImageData(imageData, 0, 0);
                });
            }

            setupEventListeners() {
                // Canvas events
                this.canvas.addEventListener('mousedown', this.startDrawing.bind(this));
                this.canvas.addEventListener('mousemove', this.draw.bind(this));
                this.canvas.addEventListener('mouseup', this.stopDrawing.bind(this));
                this.canvas.addEventListener('mouseout', this.stopDrawing.bind(this));

                // Touch events for mobile
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const mouseEvent = new MouseEvent('mouseup', {});
                    this.canvas.dispatchEvent(mouseEvent);
                });

                // Control events
                document.getElementById('brushSize').addEventListener('input', (e) => {
                    this.settings.brushSize = parseInt(e.target.value);
                    document.getElementById('brushSizeValue').textContent = e.target.value;
                    this.updateBrushPreview();
                });

                document.getElementById('opacity').addEventListener('input', (e) => {
                    this.settings.opacity = parseInt(e.target.value) / 100;
                    document.getElementById('opacityValue').textContent = e.target.value + '%';
                    this.updateBrushPreview();
                });

                document.getElementById('speedFactor').addEventListener('input', (e) => {
                    this.settings.speedFactor = parseFloat(e.target.value);
                    document.getElementById('speedFactorValue').textContent = e.target.value + 'x';
                });

                document.getElementById('colorShift').addEventListener('input', (e) => {
                    this.settings.colorShift = parseInt(e.target.value);
                    document.getElementById('colorShiftValue').textContent = e.target.value + '%';
                });

                // Mode selection
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.settings.mode = e.target.dataset.mode;
                    });
                });

                // Action buttons
                document.getElementById('saveBtn').addEventListener('click', () => this.exportPNG());
                document.getElementById('saveSvgBtn').addEventListener('click', () => this.exportSVG());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearCanvas());
                document.getElementById('recordBtn').addEventListener('click', () => this.toggleRecording());
            }

            setupColorHarmony() {
                const container = document.getElementById('colorHarmony');
                container.innerHTML = '';
                
                this.currentHarmony.forEach((color, index) => {
                    const colorDiv = document.createElement('div');
                    colorDiv.className = 'harmony-color';
                    colorDiv.style.backgroundColor = color;
                    colorDiv.addEventListener('click', () => {
                        // Cycle to next color harmony
                        const currentIndex = this.colorHarmonies.indexOf(this.currentHarmony);
                        const nextIndex = (currentIndex + 1) % this.colorHarmonies.length;
                        this.currentHarmony = this.colorHarmonies[nextIndex];
                        this.setupColorHarmony();
                        this.updateBrushPreview();
                    });
                    container.appendChild(colorDiv);
                });
            }

            updateBrushPreview() {
                const preview = document.getElementById('brushPreview');
                const size = Math.min(this.settings.brushSize * 2, 70);
                const color = this.currentHarmony[0];
                preview.innerHTML = `<div style="
                    width: ${size}px;
                    height: ${size}px;
                    background: linear-gradient(135deg, ${color}, ${this.currentHarmony[1] || color});
                    border-radius: 50%;
                    margin: auto;
                    margin-top: ${(88 - size) / 2}px;
                    opacity: ${this.settings.opacity};
                    box-shadow: 0 0 ${size/2}px ${color}40;
                "></div>`;
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            calculateSpeed(pos, time) {
                if (!this.lastPos || !this.lastTime) return 0;
                
                const dx = pos.x - this.lastPos.x;
                const dy = pos.y - this.lastPos.y;
                const dt = time - this.lastTime;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                return dt > 0 ? distance / dt * 16.67 : 0; // Normalize to ~60fps
            }

            getColorFromSpeed(speed) {
                const normalizedSpeed = Math.min(speed / 20, 1);
                const colorIndex = Math.floor(normalizedSpeed * (this.currentHarmony.length - 1));
                const nextColorIndex = Math.min(colorIndex + 1, this.currentHarmony.length - 1);
                const factor = (normalizedSpeed * (this.currentHarmony.length - 1)) % 1;
                
                return this.interpolateColor(
                    this.currentHarmony[colorIndex],
                    this.currentHarmony[nextColorIndex],
                    factor
                );
            }

            interpolateColor(color1, color2, factor) {
                const rgb1 = this.hexToRgb(color1);
                const rgb2 = this.hexToRgb(color2);
                
                const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * factor);
                const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * factor);
                const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * factor);
                
                return `rgb(${r}, ${g}, ${b})`;
            }

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }

            startDrawing(e) {
                this.isDrawing = true;
                const pos = this.getMousePos(e);
                this.lastPos = pos;
                this.lastTime = Date.now();
                this.strokeCount++;
                
                // Show recording indicator
                document.getElementById('recordingIndicator').classList.add('active');
                
                // Update stats
                this.updateStats();
                
                // If recording, capture starting point
                if (this.isRecording) {
                    this.recordingData.push({
                        type: 'start',
                        time: Date.now(),
                        position: pos,
                        settings: {...this.settings},
                        colorHarmony: [...this.currentHarmony]
                    });
                }
            }

            draw(e) {
                if (!this.isDrawing) return;

                const pos = this.getMousePos(e);
                const time = Date.now();
                const speed = this.calculateSpeed(pos, time);
                
                // Update speed tracking
                this.currentSpeed = speed;
                this.maxSpeed = Math.max(this.maxSpeed, speed);
                this.speeds.push(speed);
                
                // Update distance tracking
                if (this.lastPos) {
                    const dx = pos.x - this.lastPos.x;
                    const dy = pos.y - this.lastPos.y;
                    this.totalDistance += Math.sqrt(dx * dx + dy * dy);
                }

                // Draw based on current settings
                this.drawBrush(pos, speed);
                
                // Update position and time
                this.lastPos = pos;
                this.lastTime = time;
                
                // Update stats
                this.updateStats();
                
                // If recording, capture drawing point
                if (this.isRecording) {
                    this.recordingData.push({
                        type: 'draw',
                        time: Date.now(),
                        position: pos,
                        speed: speed
                    });
                }
            }

            drawBrush(pos, speed) {
                // Get color based on speed
                const color = this.getColorFromSpeed(speed * this.settings.speedFactor);
                
                // Calculate brush size based on speed
                const size = this.settings.brushSize + (speed * 0.5);
                
                // Set global alpha
                this.ctx.globalAlpha = this.settings.opacity;
                
                // Render based on selected mode
                switch (this.settings.mode) {
                    case 'flow':
                        this.drawFlow(pos, color, size);
                        break;
                    case 'burst':
                        this.drawBurst(pos, color, size, speed);
                        break;
                    case 'trail':
                        this.drawTrail(pos, color, size);
                        break;
                    case 'spiral':
                        this.drawSpiral(pos, color, size, speed);
                        break;
                }
            }

            drawFlow(pos, color, size) {
                // Draw radial gradient circle
                this.ctx.beginPath();
                const gradient = this.ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, size);
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, color + '40');
                this.ctx.fillStyle = gradient;
                this.ctx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Draw connecting line if we have a previous position
                if (this.lastPos) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.lastPos.x, this.lastPos.y);
                    this.ctx.lineTo(pos.x, pos.y);
                    this.ctx.strokeStyle = color;
                    this.ctx.lineWidth = size;
                    this.ctx.stroke();
                }
            }

            drawBurst(pos, color, size, speed) {
                // Draw multiple particles around the position
                const particles = Math.floor(speed / 2) + 3;
                for (let i = 0; i < particles; i++) {
                    const angle = (Math.PI * 2 / particles) * i + Date.now() * 0.001;
                    const radius = Math.random() * size * 1.5;
                    const x = pos.x + Math.cos(angle) * radius;
                    const y = pos.y + Math.sin(angle) * radius;
                    
                    this.ctx.beginPath();
                    const particleSize = Math.random() * size / 3 + 2;
                    this.ctx.arc(x, y, particleSize, 0, Math.PI * 2);
                    this.ctx.fillStyle = color;
                    this.ctx.fill();
                }
            }

            drawTrail(pos, color, size) {
                if (!this.lastPos) return;
                
                // Draw multiple circles along the path to create a trail effect
                const trailLength = 8;
                for (let i = 0; i < trailLength; i++) {
                    const factor = i / trailLength;
                    const x = this.lastPos.x + (pos.x - this.lastPos.x) * factor;
                    const y = this.lastPos.y + (pos.y - this.lastPos.y) * factor;
                    const trailSize = size * (1 - factor * 0.7);
                    
                    this.ctx.globalAlpha = this.settings.opacity * (1 - factor * 0.8);
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, trailSize / 2, 0, Math.PI * 2);
                    this.ctx.fillStyle = color;
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = this.settings.opacity;
            }

            drawSpiral(pos, color, size, speed) {
                // Draw a spiral pattern
                const spiralRadius = size * 3;
                const spiralTurns = speed / 8 + 1;
                
                this.ctx.beginPath();
                for (let i = 0; i < spiralTurns * 30; i++) {
                    const angle = (i / 30) * Math.PI * 2;
                    const radius = (i / (spiralTurns * 30)) * spiralRadius;
                    const x = pos.x + Math.cos(angle) * radius;
                    const y = pos.y + Math.sin(angle) * radius;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = 3;
                this.ctx.stroke();
            }

            stopDrawing() {
                this.isDrawing = false;
                this.lastPos = null;
                this.lastTime = 0;
                
                // Hide recording indicator
                document.getElementById('recordingIndicator').classList.remove('active');
                
                // If recording, capture ending point
                if (this.isRecording) {
                    this.recordingData.push({
                        type: 'end',
                        time: Date.now()
                    });
                }
            }

            updateStats() {
                document.getElementById('strokeCount').textContent = this.strokeCount;
                document.getElementById('totalDistance').textContent = Math.round(this.totalDistance) + 'px';
                
                const avgSpeed = this.speeds.length > 0 ? 
                    this.speeds.reduce((a, b) => a + b, 0) / this.speeds.length : 0;
                document.getElementById('avgSpeed').textContent = Math.round(avgSpeed) + 'px/s';
                document.getElementById('maxSpeed').textContent = Math.round(this.maxSpeed) + 'px/s';
            }

            clearCanvas() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.strokeCount = 0;
                this.totalDistance = 0;
                this.maxSpeed = 0;
                this.speeds = [];
                this.svgElements = [];
                this.recordingData = [];
                this.updateStats();
                this.showToast('Canvas cleared successfully');
            }

            exportPNG() {
                const link = document.createElement('a');
                link.download = `mouseflow-pro-${Date.now()}.png`;
                link.href = this.canvas.toDataURL('image/png', 1.0);
                link.click();
                this.showToast('High-quality PNG exported');
            }

            exportSVG() {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', this.canvas.width);
                svg.setAttribute('height', this.canvas.height);
                svg.setAttribute('viewBox', `0 0 ${this.canvas.width} ${this.canvas.height}`);
                svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('width', '100%');
                rect.setAttribute('height', '100%');
                rect.setAttribute('fill', '#000000');
                svg.appendChild(rect);
                
                const image = document.createElementNS('http://www.w3.org/2000/svg', 'image');
                image.setAttribute('href', this.canvas.toDataURL());
                image.setAttribute('width', this.canvas.width);
                image.setAttribute('height', this.canvas.height);
                svg.appendChild(image);
                
                const svgData = new XMLSerializer().serializeToString(svg);
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.download = `mouseflow-pro-${Date.now()}.svg`;
                link.href = url;
                link.click();
                
                URL.revokeObjectURL(url);
                this.showToast('Vector SVG exported');
            }

            toggleRecording() {
                this.isRecording = !this.isRecording;
                const recordBtn = document.getElementById('recordBtn');
                
                if (this.isRecording) {
                    recordBtn.textContent = 'Stop Recording';
                    recordBtn.style.background = 'linear-gradient(135deg, var(--primary), var(--primary-dark))';
                    this.recordingData = [];
                    this.showToast('Recording started');
                } else {
                    recordBtn.textContent = 'Record Session';
                    recordBtn.style.background = 'linear-gradient(135deg, var(--surface), var(--surface-light))';
                    this.saveRecording();
                }
            }

            saveRecording() {
                if (this.recordingData.length === 0) {
                    this.showToast('No recording data to save');
                    return;
                }
                
                const jsonData = JSON.stringify(this.recordingData);
                const blob = new Blob([jsonData], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.download = `mouseflow-recording-${Date.now()}.json`;
                link.href = url;
                link.click();
                
                URL.revokeObjectURL(url);
                this.showToast('Session recording saved');
            }

            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3500);
            }

            animate() {
                // This method can be used for continuous animations
                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize the application
        window.addEventListener('DOMContentLoaded', () => {
            const app = new MouseArtGenerator();
        });
    </script>
</body>
